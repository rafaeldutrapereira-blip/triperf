    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap"

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --amber: #f59e0b;
        --blue: #1d4ed8;
        --rc-good: #22d3ee;
        --rc-moderate: #f0a500;
        --rc-low: #f59e0b;
        --rc-critical: #ef4444;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        overflow-x: hidden;
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%230891b2' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ul {
        list-style: none;
      }

      .c {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 clamp(1.25rem, 4vw, 2.5rem);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        font-family: 'Oswald', sans-serif;
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 0.7rem 1.5rem;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        transition: all var(--ease);
      }
      .btn-g {
        background: transparent;
        color: var(--muted);
        border: 1.5px solid var(--border);
      }
      .btn-g:hover {
        border-color: var(--cyan);
        color: var(--cyan);
      }
      .btn-sm {
        padding: 0.42rem 0.95rem;
        font-size: 0.74rem;
      }
      .btn-primary {
        background: var(--green);
        color: #fff;
      }
      .btn-primary:hover {
        opacity: 0.88;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .panel-head {
        padding: 1rem 1.4rem;
        border-bottom: 1px solid var(--border2);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      .panel-title {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .sr {
        opacity: 0;
        transform: translateY(20px);
        transition:
          opacity 0.5s var(--ease),
          transform 0.5s var(--ease);
      }
      .vis {
        opacity: 1;
        transform: none;
      }
      .g2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
      }
      .g3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.2rem;
      }
      .g5 {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 1rem;
      }
      @media (max-width: 1000px) {
        .g5 {
          grid-template-columns: repeat(3, 1fr);
        }
        .g3 {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 720px) {
        .g3 {
          grid-template-columns: 1fr;
        }
        .g2 {
          grid-template-columns: 1fr;
        }
        .g5 {
          grid-template-columns: 1fr 1fr;
        }
      }
      .mt2 {
        margin-top: 1.5rem;
      }
      .mt3 {
        margin-top: 2rem;
      }
      .sec-h {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 1rem;
      }

      /* ── PAGE HEADER ── */
      .ph {
        padding-top: 1.5rem;
        background: linear-gradient(180deg, #060e1c 0%, var(--bg) 100%);
        border-bottom: 1px solid var(--border2);
      }
      .ph-inner {
        padding: 1.6rem 0 1.4rem;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
      }

      /* ── RECOVERY SCORE WIDGET ── */
      .rc-hero {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.8rem;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2rem;
        align-items: center;
      }
      @media (max-width: 600px) {
        .rc-hero {
          grid-template-columns: 1fr;
          text-align: center;
        }
      }
      .rc-dial {
        position: relative;
        width: 140px;
        height: 140px;
        flex-shrink: 0;
      }
      .rc-dial-svg {
        width: 140px;
        height: 140px;
      }
      .rc-dial-score {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .rc-score-n {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 2.8rem;
        font-weight: 900;
        line-height: 1;
      }
      .rc-score-l {
        font-family: 'Oswald', sans-serif;
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
        margin-top: 0.1rem;
      }
      .rc-label {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .rc-rec {
        font-size: 0.82rem;
        color: var(--muted);
        line-height: 1.6;
        margin-bottom: 1rem;
      }
      .rc-title {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 1.35rem;
        margin-bottom: 0.5rem;
      }
      .rc-detail-btn {
        margin-top: 1rem;
        padding: 0.5rem 1.1rem;
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-family: inherit;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
      }
      .rc-detail-btn:hover {
        border-color: var(--green);
      }
      .rc-factors {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .rc-factor {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.18rem;
        padding: 0.45rem 0.65rem;
        background: var(--surface2);
        border-radius: 8px;
        border: 1px solid var(--border2);
        min-width: 68px;
      }
      .rc-factor-n {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 1.05rem;
        font-weight: 800;
        line-height: 1;
      }
      .rc-factor-l {
        font-family: 'Oswald', sans-serif;
        font-size: 0.56rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .rc-factor-bar {
        width: 100%;
        height: 3px;
        border-radius: 2px;
        background: var(--surface);
        margin-top: 0.15rem;
        overflow: hidden;
      }
      .rc-factor-fill {
        height: 100%;
        border-radius: 2px;
        transition: width 0.8s ease;
      }

      /* ── TABS ── */
      .tabs-bar {
        display: flex;
        gap: 0.2rem;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--border);
      }
      .tab-btn {
        font-family: 'Oswald', sans-serif;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 0.65rem 1.1rem;
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        color: var(--muted);
        cursor: pointer;
        white-space: nowrap;
        transition:
          color 0.18s,
          border-color 0.18s;
        margin-bottom: -1px;
      }
      .tab-btn:hover {
        color: var(--text);
      }
      .tab-btn.on {
        background: none;
        color: var(--orange);
        border-bottom-color: var(--orange);
      }
      .proto-tabs {
        display: flex;
        gap: 0.2rem;
        flex-wrap: wrap;
        margin-bottom: 1.5rem;
        border-bottom: 1px solid var(--border);
      }
      .proto-tab {
        font-family: 'Oswald', sans-serif;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 0.65rem 1.1rem;
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        color: var(--muted);
        cursor: pointer;
        white-space: nowrap;
        transition:
          color 0.18s,
          border-color 0.18s;
        margin-bottom: -1px;
      }
      .proto-tab:hover {
        color: var(--text);
      }
      .proto-tab.on {
        color: var(--orange);
        border-bottom-color: var(--orange);
      }
      .tab-pane {
        display: none;
      }
      .tab-pane.on {
        display: block;
      }

      /* ── KPI box ── */
      .kpi-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.9rem 1rem;
        text-align: center;
      }
      .kpi-n {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 1.8rem;
        font-weight: 900;
        line-height: 1;
      }
      .kpi-l {
        font-family: 'Oswald', sans-serif;
        font-size: 0.58rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
        margin-top: 0.2rem;
      }
      .kpi-s {
        font-size: 0.68rem;
        color: var(--muted);
        margin-top: 0.06rem;
      }

      /* ── WELLNESS STARS ── */
      .well-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.55rem 0;
        border-bottom: 1px solid var(--border2);
        gap: 0.75rem;
      }
      .well-row:last-child {
        border-bottom: none;
      }
      .well-label {
        font-size: 0.8rem;
        color: var(--muted);
        flex: 1;
      }
      .well-stars {
        display: flex;
        gap: 0.25rem;
      }
      .star {
        width: 24px;
        height: 24px;
        cursor: pointer;
        transition: transform 0.15s;
        font-size: 1.1rem;
        line-height: 1;
        border: none;
        background: none;
        padding: 0;
      }
      .star:hover {
        transform: scale(1.2);
      }
      .star.active {
        color: var(--gold);
      }
      .star.inactive {
        color: var(--dim);
      }

      /* ── SLEEP PHASES ── */
      .phase-bar {
        display: flex;
        height: 28px;
        border-radius: 6px;
        overflow: hidden;
        margin: 0.5rem 0;
      }
      .phase-seg {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Oswald', sans-serif;
        font-size: 0.58rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.9);
        overflow: hidden;
        white-space: nowrap;
        transition: all 0.6s;
      }

      /* ── MINI CHART ── */
      .mini-bars {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 48px;
      }
      .mini-bar {
        flex: 1;
        border-radius: 2px 2px 0 0;
        transition: all 0.4s;
        cursor: default;
        min-width: 4px;
      }

      /* ── RECOMMENDATION BOX ── */
      .rec-box {
        border-radius: 10px;
        padding: 1.2rem 1.4rem;
        border: 1px solid;
        margin-bottom: 1rem;
      }
      .rec-box.optimal {
        background: rgba(16, 185, 129, 0.06);
        border-color: rgba(16, 185, 129, 0.3);
      }
      .rec-box.good {
        background: rgba(34, 211, 238, 0.06);
        border-color: rgba(34, 211, 238, 0.3);
      }
      .rec-box.moderate {
        background: rgba(240, 165, 0, 0.06);
        border-color: rgba(240, 165, 0, 0.3);
      }
      .rec-box.low {
        background: rgba(245, 158, 11, 0.07);
        border-color: rgba(245, 158, 11, 0.3);
      }
      .rec-box.critical {
        background: rgba(239, 68, 68, 0.06);
        border-color: rgba(239, 68, 68, 0.3);
      }
      .rec-title {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 1.1rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
      }
      .rec-text {
        font-size: 0.82rem;
        color: var(--muted);
        line-height: 1.6;
      }

      /* ── TIMELINE CHART ── */
      .timeline-row {
        display: grid;
        grid-template-columns: 60px 1fr;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.35rem;
      }
      .timeline-date {
        font-family: 'Oswald', sans-serif;
        font-size: 0.6rem;
        color: var(--dim);
        text-align: right;
        letter-spacing: 0.06em;
      }
      .timeline-bar-wrap {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .timeline-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .timeline-val {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 0.85rem;
        font-weight: 800;
        width: 28px;
        text-align: right;
      }

      /* ── PROTOCOL CARD ── */
      .proto-day {
        display: grid;
        grid-template-columns: 90px 80px 1fr;
        gap: 0.75rem;
        padding: 0.75rem 0;
        border-bottom: 1px solid var(--border2);
        align-items: start;
      }
      .proto-day:last-child {
        border-bottom: none;
      }
      .proto-phase {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 0.95rem;
        font-weight: 800;
        color: var(--coral);
      }
      .proto-load {
        display: inline-flex;
        align-items: center;
        padding: 0.22rem 0.6rem;
        border-radius: 4px;
        font-family: 'Oswald', sans-serif;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .proto-load.rest {
        background: rgba(239, 68, 68, 0.15);
        color: var(--red);
      }
      .proto-load.easy {
        background: rgba(16, 185, 129, 0.15);
        color: var(--green);
      }
      .proto-load.moderate {
        background: rgba(240, 165, 0, 0.15);
        color: var(--gold);
      }
      .proto-load.full {
        background: rgba(14, 165, 233, 0.15);
        color: var(--cyan);
      }
      .proto-actions {
        font-size: 0.78rem;
        color: var(--muted);
        line-height: 1.5;
      }

      /* ── ALERT CHIP ── */
      .alert-chip {
        display: flex;
        align-items: flex-start;
        gap: 0.6rem;
        padding: 0.65rem 0.9rem;
        border-radius: 8px;
        font-size: 0.78rem;
        color: var(--text);
        line-height: 1.5;
        margin-bottom: 0.5rem;
      }
      .alert-chip.high {
        background: rgba(239, 68, 68, 0.08);
        border: 1px solid rgba(239, 68, 68, 0.25);
      }
      .alert-chip.medium {
        background: rgba(240, 165, 0, 0.07);
        border: 1px solid rgba(240, 165, 0, 0.25);
      }
      .alert-chip.info {
        background: rgba(14, 165, 233, 0.06);
        border: 1px solid rgba(14, 165, 233, 0.2);
      }

      /* ── CORRELATION CHART ── */
      .corr-item {
        display: grid;
        grid-template-columns: 80px 1fr auto;
        gap: 0.75rem;
        align-items: center;
        padding: 0.4rem 0;
        border-bottom: 1px solid var(--border2);
        font-size: 0.78rem;
      }
      .corr-item:last-child {
        border-bottom: none;
      }
      .corr-date {
        color: var(--dim);
        font-size: 0.7rem;
      }
      .corr-bar-wrap {
        background: var(--surface2);
        border-radius: 3px;
        height: 8px;
        overflow: hidden;
      }
      .corr-fill {
        height: 100%;
        border-radius: 3px;
      }
      .corr-val {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 0.9rem;
        font-weight: 800;
        text-align: right;
      }

      /* ── COACH VIEW ── */
      .athlete-row {
        display: grid;
        grid-template-columns: 36px 1fr 80px 80px 80px auto;
        gap: 0.75rem;
        align-items: center;
        padding: 0.65rem 0.85rem;
        border-radius: 8px;
        margin-bottom: 0.4rem;
        border: 1px solid var(--border2);
      }
      .athlete-row:hover {
        border-color: var(--border);
      }
      .athlete-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 0.95rem;
        font-weight: 800;
      }
      .athlete-name {
        font-size: 0.85rem;
        font-weight: 600;
      }
      .score-pill {
        padding: 0.2rem 0.65rem;
        border-radius: 20px;
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 1rem;
        font-weight: 800;
        text-align: center;
      }

      footer {
        border-top: 1px solid var(--border2);
        padding: 1.5rem 0;
        text-align: center;
      }
      footer div {
        font-family: 'Oswald', sans-serif;
        font-size: 0.7rem;
        color: var(--dim);
        letter-spacing: 0.1em;
      }

      /* ── PROGRESS BARS (shared) ── */
      .g-rb {
        background: var(--surface2);
        border-radius: 3px;
        height: 5px;
        overflow: hidden;
        margin-top: 0.4rem;
      }
      .g-rf {
        height: 100%;
        border-radius: 3px;
        background: var(--gc, var(--green));
        transition: width 0.8s ease;
      }
    </style>
    <link rel="stylesheet" href="nav.css?v=3" />
    <style>
      /* Modo embed (?embed=1): vista incrustada en otra página (plan, coach). */
      .lx-embed body {
        padding-left: 0 !important;
      }
      .lx-embed #sidebar,
      .lx-embed .sb-topbar {
        display: none !important;
      }
    </style>
    <script>
      if (new URLSearchParams(location.search).get('embed') === '1') {
        document.documentElement.classList.add('lx-embed');
      }
    </script>
  </head>
  <body>
    <!-- SIDEBAR -->
    <aside id="sidebar"></aside>
    <header class="sb-topbar"></header>
    <div class="sb-overlay" id="sb-overlay"></div>

    <div style="padding: 2rem 0 5rem">
      <div class="c">
        <!-- ══ TABS ══ -->
        <section class="sr mt2 vis" id="sec-tabs">
          <div class="panel">
            <div class="panel-head">
              <span class="panel-title">
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="var(--green)"
                  stroke-width="2.5"
                >
                  <path
                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
                  />
                </svg>
                <span data-i18n="rcw_title">Análisis de Recuperación</span>
              </span>
            </div>
            <div style="padding: 1.5rem">
              <!-- ── TAB: COACH ── -->
              <div class="tab-pane on" id="tab-coach">
                <div id="coach-view-content">
                  <div
                    style="color: var(--dim); font-size: 0.82rem"
                    data-i18n="rcw_loading_athletes"
                  >
                    Cargando vista de atletas…
                  </div>
                </div>
              </div>
            </div>
            <!-- /padding -->
          </div>
          <!-- /panel -->
        </section>
      </div>
      <!-- /c -->
    </div>
    <!-- /padding -->

    <script src="auth.js"></script>
    <script src="nav.js?v=5" defer></script>
    <script src="footer.js"></script>
    <script src="dash-header.js"></script>
    <script src="lx-upgrade.js"></script>
    <script>
      (function () {
        'use strict';

        var _k =
          JSON.parse(
            sessionStorage.getItem('kl_s') ||
              localStorage.getItem('kl_s') ||
              'null',
          ) || {};
        var API = '/api';
        function _authToken() {
          var direct = localStorage.getItem('lx_co_token');
          if (direct) return direct;
          return _k.token || '';
        }
        var hdrs = {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + _authToken(),
        };

        function _t(key, fallback) {
          return (window.i18n ? window.i18n.t(key) : null) || fallback;
        }

        // W12: solo queda la vista de coach (?view=coach). El cuerpo de atleta
        // vive en estado.html desde S12/S13.
        function loadCoachView() {
          fetch(API + '/recovery/coach-view', { headers: hdrs })
            .then(function (r) {
              if (r.status === 403) return null;
              return r.json();
            })
            .then(function (d) {
              if (!d) return;
              var el = document.getElementById('coach-view-content');
              var athletes = d.athletes || [];
              if (!athletes.length) {
                el.innerHTML =
                  '<div style="color:var(--dim);font-size:.82rem">' +
                  _t('rcw_no_active_athletes', 'No tienes atletas activos.') +
                  '</div>';
                return;
              }

              var html =
                '<div style="margin-bottom:.75rem;display:flex;gap:1rem;font-size:.78rem;color:var(--muted)">' +
                '<span>🔴 ' +
                _t('rcw_need_attention', 'Necesitan atención:') +
                ' <strong style="color:var(--red)">' +
                (d.red_count || 0) +
                '</strong></span>' +
                '<span>🟢 ' +
                _t('rcw_doing_well', 'Bien:') +
                ' <strong style="color:var(--green)">' +
                (d.green_count || 0) +
                '</strong></span></div>';

              athletes.forEach(function (a) {
                var initials = (a.name || 'X')
                  .split(' ')
                  .map(function (w) {
                    return w[0];
                  })
                  .join('')
                  .toUpperCase()
                  .substring(0, 2);
                var scoreCol = a.color || 'var(--muted)';
                html +=
                  '<div class="athlete-row"' +
                  (a.needs_attention
                    ? ' style="border-color:rgba(239,68,68,.4)"'
                    : '') +
                  '>' +
                  '<div class="athlete-avatar" style="background:' +
                  scoreCol +
                  '20;color:' +
                  scoreCol +
                  '">' +
                  initials +
                  '</div>' +
                  '<div>' +
                  '<div class="athlete-name">' +
                  a.name +
                  (a.needs_attention ? ' ⚠️' : '') +
                  '</div>' +
                  '<div style="font-size:.68rem;color:var(--dim)">' +
                  (a.suggestion || '') +
                  ' · HRV ' +
                  a.hrv_trend +
                  '</div>' +
                  '</div>' +
                  '<div class="score-pill" style="background:' +
                  scoreCol +
                  '20;color:' +
                  scoreCol +
                  '">' +
                  (a.score !== null ? a.score : '—') +
                  '</div>' +
                  '<div style="font-size:.72rem;color:var(--dim);text-align:center">' +
                  (a.factors
                    ? 'HRV<br>' + Math.round(a.factors.hrv || 0)
                    : '') +
                  '</div>' +
                  '<div style="font-size:.72rem;color:var(--dim);text-align:center">' +
                  (a.factors
                    ? _t('kpi_sleep', 'Sleep') +
                      '<br>' +
                      Math.round(a.factors.sleep || 0)
                    : '') +
                  '</div>' +
                  '<div style="font-size:.72rem;color:var(--dim);text-align:center;white-space:nowrap">TSB<br>' +
                  Math.round(a.factors ? a.factors.tsb || 0 : 0) +
                  '</div>' +
                  '</div>';
              });
              el.innerHTML = html;
            })
            .catch(function () {});
        }

        /* Vista de coach (atletas): se abre embebida desde Coach con ?view=coach. */
        if (new URLSearchParams(location.search).get('view') === 'coach') {
          loadCoachView();
        }

        // Update nav user info
        setTimeout(function () {
          if (typeof KL !== 'undefined' && KL.init) KL.init();
        }, 200);
      })();
    </script>
    <script src="lx-audit.js"></script>
  </body>
</html>
