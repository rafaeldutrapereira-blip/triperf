[pytest]
# LabX E2E Test Suite — Playwright + pytest
# Run: pytest e2e/ -v --headed          (visual)
# Run: pytest e2e/ -v                   (headless CI)
# Run: pytest e2e/ -m smoke -v          (smoke only, ~2 min)
# Run: pytest e2e/ -m critical -v       (critical paths, ~5 min)
# Run: pytest e2e/ -v --slowmo=500      (slow-motion for debug)

addopts =
    --base-url=http://localhost:8000
    --timeout=30
    -p no:warnings

markers =
    smoke:     fast sanity checks (< 2 min total)
    critical:  must-pass before any deploy
    auth:      authentication & session flows
    coach:     coach platform flows
    athlete:   athlete portal flows
    ai:        AI Coach integration
    garmin:    Garmin sync (some steps require manual credentials)
    mobile:    PWA / mobile viewport flows
    payments:  Stripe billing flows (require Stripe test keys)
    realtime:  SSE / WebSocket real-time flows
    slow:      tests that take > 10s each
    manual:    requires human intervention (OAuth, MFA, etc.)
