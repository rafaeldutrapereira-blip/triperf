# LabX — Nginx config para beta.labx.app (Private Beta)
# ==========================================================
# Instalar en: /etc/nginx/sites-available/beta.labx.app
# Activar con: ln -s /etc/nginx/sites-available/beta.labx.app /etc/nginx/sites-enabled/
# SSL:         certbot --nginx -d beta.labx.app
#
# Private Beta: acceso restringido por Basic Auth + allow-list de IPs

# Rate limit zones
limit_req_zone  $binary_remote_addr zone=labx_auth:10m    rate=10r/m;
limit_req_zone  $binary_remote_addr zone=labx_api:10m     rate=60r/m;
limit_req_zone  $binary_remote_addr zone=labx_static:10m  rate=300r/m;
limit_conn_zone $binary_remote_addr zone=labx_conn:10m;

# Real IP desde Cloudflare
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name beta.labx.app;
    return 301 https://$host$request_uri;
}

# ── HTTPS Main ────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beta.labx.app;

    # SSL — Certbot managed (se actualiza automáticamente con certbot renew)
    ssl_certificate     /etc/letsencrypt/live/beta.labx.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.labx.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # TLS hardening
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # Security headers
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "DENY" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection           "1; mode=block" always;
    add_header Content-Security-Policy
        "default-src 'self';
         script-src 'self' 'unsafe-inline' https://js.stripe.com https://unpkg.com https://cdn.jsdelivr.net;
         style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com;
         font-src 'self' https://fonts.gstatic.com;
         img-src 'self' data: blob: https:;
         connect-src 'self' https://api.stripe.com https://o*.ingest.sentry.io wss://beta.labx.app;
         frame-src https://js.stripe.com;
         worker-src 'self' blob:;
         manifest-src 'self'" always;

    server_tokens off;
    limit_conn labx_conn 20;
    client_max_body_size 5M;

    # Static files served por nginx directamente
    root /var/www/labx;
    index login.html;

    # ── PRIVATE BETA: Basic Auth para todas las rutas no-API ─────────────
    # Generar .htpasswd: echo "fundador:$(openssl passwd -apr1 '<password>')" > /etc/nginx/.htpasswd-beta
    # Para eliminar restricción en go-live público: eliminar las líneas auth_basic
    auth_basic           "LabX Beta Privada";
    auth_basic_user_file /etc/nginx/.htpasswd-beta;

    # ── Static files ─────────────────────────────────────────────────────
    location ~* \.(js|css|png|ico|svg|woff2?|ttf|webp)$ {
        auth_basic off;  # Assets públicos — no requieren auth
        expires 30d;
        add_header Cache-Control "public, immutable";
        limit_req zone=labx_static burst=100 nodelay;
        try_files $uri =404;
    }

    location ~ ^/(manifest\.json|sw\.js|favicon\.ico|robots\.txt)$ {
        auth_basic off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # ── SSE — sin buffering, conexión persistente ─────────────────────────
    location /api/events {
        auth_basic off;
        proxy_pass          http://127.0.0.1:8000;
        proxy_http_version  1.1;
        proxy_set_header    Connection "";
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Authorization     $http_authorization;
    }

    # ── Auth endpoints — rate limit estricto ─────────────────────────────
    location ~ ^/api(/v1)?/auth/(login|register|forgot-password|reset-password) {
        auth_basic off;
        limit_req zone=labx_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass          http://127.0.0.1:8000;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  30s;
    }

    # ── Stripe webhook — sin rate limit ──────────────────────────────────
    location ~ ^/api(/v1)?/(stripe|payments)/webhook {
        auth_basic off;
        proxy_pass          http://127.0.0.1:8000;
        proxy_http_version  1.1;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        proxy_set_header    stripe-signature    $http_stripe_signature;
        client_max_body_size 1M;
        proxy_read_timeout  30s;
    }

    # ── Garmin / Strava OAuth callbacks — sin auth Basic ─────────────────
    location ~ ^/api/(garmin|strava)/(callback|connect|oauth) {
        auth_basic off;
        proxy_pass          http://127.0.0.1:8000;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
    }

    # ── Métricas Prometheus — solo acceso local ───────────────────────────
    location /api/metrics {
        auth_basic off;
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # ── Health check ─────────────────────────────────────────────────────
    location /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # ── API general ───────────────────────────────────────────────────────
    location /api {
        auth_basic off;
        limit_req zone=labx_api burst=30 nodelay;
        proxy_pass          http://127.0.0.1:8000;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Authorization     $http_authorization;
        proxy_read_timeout  90s;
        proxy_send_timeout  90s;
        proxy_connect_timeout 10s;
    }

    # ── SPA — todas las rutas HTML van a login.html si no existen ────────
    location / {
        try_files $uri $uri/ /login.html;
    }

    # ── Bloquear archivos sensibles ───────────────────────────────────────
    location ~ /\.(env|git|htpasswd|gitignore|DS_Store) {
        deny all;
        return 404;
    }
    location ~ \.(py|db|sqlite|sql|sh|key|pem)$ {
        deny all;
        return 404;
    }
    location ~ ^/(data|backups|logs|alembic|api)/ {
        deny all;
        return 404;
    }

    # Logs estructurados
    access_log /var/log/nginx/labx_beta_access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/labx_beta_error.log warn;
}
