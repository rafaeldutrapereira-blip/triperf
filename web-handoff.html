<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LabX</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0b1220; color:#e5e7eb; font-family:system-ui,-apple-system,sans-serif; text-align:center; padding:1.5rem; }
  a { color:#38bdf8; }
</style>
</head>
<body>
<div>
  <p id="hd-msg">Abriendo LabX en la web…</p>
  <p id="hd-err" style="display:none">
    <span id="hd-err-txt">El enlace venció o ya se usó.</span><br>
    <a href="login.html">Iniciar sesión</a>
  </p>
</div>
<script>
(function () {
  /* P0 — canje del token de handoff (un solo uso). El token viaja en el
     fragmento (#t=...), no llega al servidor ni a los logs. El destino NO se
     toma de la URL: lo decide el servidor al canjear (lista cerrada). */
  var PLAN_MAP = { elite: 'elite', agegroup: 'agegroup', basico: 'basic' };
  var ROLE_LABELS = { admin: 'Admin · Coach', coach: 'Coach', atleta: 'Atleta' };
  var m = /[#&]t=([^&]+)/.exec(location.hash || '');
  var token = m ? decodeURIComponent(m[1]) : '';
  /* Borra el token de la barra de direcciones/historial de inmediato. */
  try { history.replaceState(null, '', location.pathname); } catch (e) {}

  function fail() {
    document.getElementById('hd-msg').style.display = 'none';
    document.getElementById('hd-err').style.display = 'block';
  }
  if (!token) { fail(); return; }

  fetch(location.origin + '/api/auth/web-handoff/redeem', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token })
  })
  .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
  .then(function (d) {
    localStorage.setItem('lx_co_token', d.access_token);
    localStorage.setItem('lx_co_rol', d.rol);
    localStorage.setItem('lx_co_nombre', d.nombre);
    var parts = (d.nombre || '').split(' ').slice(0, 2);
    var sess = {
      username: d.email, email: d.email, name: d.nombre,
      initials: parts.map(function (w) { return w[0] || ''; }).join('').toUpperCase() || 'U',
      role: ROLE_LABELS[d.rol] || d.rol, plan: PLAN_MAP[d.plan_nivel] || 'basic',
      api_rol: d.rol, user_id: d.user_id, ts: Date.now()
    };
    var json = JSON.stringify(sess);
    sessionStorage.setItem('kl_s', json);
    localStorage.setItem('kl_s', json);
    /* d.path viene del servidor (ruta fija); aun asi solo se acepta ruta local. */
    var p = (typeof d.path === 'string' && /^\/[A-Za-z0-9_\-]+\.html$/.test(d.path)) ? d.path : '/dashboard.html';
    location.replace(p);
  })
  .catch(fail);
})();
</script>
</body>
</html>
