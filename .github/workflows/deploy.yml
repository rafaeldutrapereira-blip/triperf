name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Force deploy even if no code changes"
        required: false
        default: "false"

concurrency:
  group: production-deploy
  cancel-in-progress: false   # never cancel a deploy in flight

jobs:
  # ── Guard: only deploy when CI passes ────────────────────────────────────
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.sha }}
          check-name: "test"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

  # ── Alembic migrations (run before rolling update) ────────────────────────
  migrate:
    name: Database Migrations
    runs-on: ubuntu-latest
    needs: wait-for-ci
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Alembic upgrade head
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/labx
            echo "── Pulling latest image ──"
            docker compose pull api
            echo "── Running Alembic migrations ──"
            docker compose run --rm api python -c "
            from alembic.config import Config
            from alembic import command
            cfg = Config('alembic.ini')
            command.upgrade(cfg, 'head')
            print('Alembic upgrade head: OK')
            "

  # ── Rolling deploy: zero-downtime via healthcheck ─────────────────────────
  deploy:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: migrate
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/labx

            echo "── Starting new container ──"
            docker compose up -d --no-deps --build api

            echo "── Waiting for health check ──"
            for i in $(seq 1 12); do
              STATUS=$(docker compose exec -T api curl -sf http://localhost:8000/health 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','err'))" 2>/dev/null || echo "err")
              if [ "$STATUS" = "ok" ]; then
                echo "Health check passed after ${i}×5s"
                break
              fi
              if [ $i -eq 12 ]; then
                echo "Health check FAILED after 60s — rolling back"
                docker compose up -d --no-deps api@$(git rev-parse HEAD~1) || true
                exit 1
              fi
              sleep 5
            done

            echo "── Restarting Celery worker ──"
            docker compose up -d --no-deps worker || true

            echo "── Pruning old images ──"
            docker image prune -f --filter "until=24h"

            echo "── Deploy complete ✓ ──"

  # ── Post-deploy smoke test ─────────────────────────────────────────────────
  smoke-test:
    name: Post-deploy Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    environment: production
    steps:
      - name: Health check from CI runner
        run: |
          APP_URL="${{ secrets.PROD_APP_URL }}"
          echo "Checking ${APP_URL}/health …"
          STATUS=$(curl -sf "${APP_URL}/health" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','err'))")
          if [ "$STATUS" != "ok" ]; then
            echo "SMOKE TEST FAILED: ${APP_URL}/health returned status=${STATUS}"
            exit 1
          fi
          echo "Smoke test passed ✓"

      - name: Notify on success
        if: success()
        run: echo "Deploy to production succeeded for ${{ github.sha }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deploy FAILED for ${{ github.sha }} — investigate immediately"
          # Add Slack/PagerDuty webhook call here when configured
