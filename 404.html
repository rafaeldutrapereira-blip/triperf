<!doctype html>
<html lang="es" translate="no">
  <head>
    <script>/* labx_theme: tema antes del primer pintado (oscuro por defecto) */(function(){try{var v=localStorage.getItem("labx_theme");document.documentElement.setAttribute("data-theme",v==="light"?"light":"dark");}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LabX — Página no encontrada</title>
    <link rel="stylesheet" href="fonts.css?v=373" />
    <link rel="stylesheet" href="theme-vars.css?v=373" />
    <script src="i18n.js?v=377"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        text-align: center;
      }
      .logo {
        font-family: 'Oswald', sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: var(--lxt-fff,#fff);
        letter-spacing: 0.05em;
        margin-bottom: 48px;
        text-decoration: none;
      }
      .logo span {
        color: var(--orange);
      }
      .num {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: clamp(6rem, 20vw, 12rem);
        font-weight: 900;
        line-height: 1;
        color: var(--orange);
        opacity: 0.3;
        letter-spacing: -0.04em;
        margin-bottom: -1rem;
      }
      h1 {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 0.75rem;
      }
      p {
        color: var(--muted);
        font-size: 0.95rem;
        max-width: 360px;
        line-height: 1.65;
        margin-bottom: 2.5rem;
      }
      .btns {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .btn {
        padding: 11px 28px;
        border-radius: 8px;
        font-family: 'Inter', sans-serif;
        font-size: 0.88rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition:
          opacity 0.2s,
          transform 0.2s;
      }
      .btn:hover {
        opacity: 0.85;
        transform: translateY(-1px);
      }
      .btn-primary {
        background: var(--orange);
        color: var(--lxt-fff,#fff);
      }
      .btn-secondary {
        background: rgba(14, 165, 233, 0.1);
        color: var(--cyan);
        border: 1px solid rgba(14, 165, 233, 0.25);
      }
    </style>
      <link rel="stylesheet" href="theme-light.css?v=349" />
    <style id="lx-theme-light">
/* TEMA-RESTO (BUILD 349): valores del tema claro; el oscuro usa los fallbacks. */
  html[data-theme='light'] { color-scheme: light; }
  [data-theme='light'] {
    --lxt-fff: #121212;
  }
    </style>
  </head>
  <body>
    <a class="logo" href="landing.html">LAB<span>X</span></a>
    <div class="num">404</div>
    <h1 data-i18n="notfound_title">Página no encontrada</h1>
    <p data-i18n="notfound_desc">
      La URL que buscas no existe o fue movida. Verifica el enlace o vuelve al
      inicio.
    </p>
    <div class="btns">
      <a
        class="btn btn-primary"
        href="landing.html"
        data-i18n="notfound_go_home"
        >Inicio</a
      >
      <a
        class="btn btn-secondary"
        id="back-btn"
        href="dashboard.html"
        data-i18n="notfound_go_dash"
        >Ir al Dashboard</a
      >
    </div>
    <script>
      (function () {
        try {
          var s = JSON.parse(
            sessionStorage.getItem('kl_s') ||
              localStorage.getItem('kl_s') ||
              'null',
          );
          if (!s) document.getElementById('back-btn').href = 'login.html';
        } catch (e) {}
      })();
    </script>
  </body>
</html>
