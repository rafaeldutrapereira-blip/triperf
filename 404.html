<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LabX — Página no encontrada</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@400;600;700&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#04080F;--orange:#FF6535;--cyan:#0EA5E9;--text:#F0F9FF;--muted:#7FB3CC;--dim:#3D6880}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center}
.logo{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;color:#fff;letter-spacing:.05em;margin-bottom:48px;text-decoration:none}
.logo span{color:var(--orange)}
.num{font-family:'Barlow Condensed',sans-serif;font-size:clamp(6rem,20vw,12rem);font-weight:900;line-height:1;color:var(--orange);opacity:.3;letter-spacing:-.04em;margin-bottom:-1rem}
h1{font-family:'Barlow Condensed',sans-serif;font-size:clamp(1.5rem,4vw,2.5rem);font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.75rem}
p{color:var(--muted);font-size:.95rem;max-width:360px;line-height:1.65;margin-bottom:2.5rem}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{padding:11px 28px;border-radius:8px;font-family:'Inter',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;text-decoration:none;transition:opacity .2s,transform .2s}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.btn-primary{background:var(--orange);color:#fff}
.btn-secondary{background:rgba(14,165,233,.1);color:var(--cyan);border:1px solid rgba(14,165,233,.25)}
</style>
</head>
<body>
  <a class="logo" href="landing.html">LAB<span>X</span></a>
  <div class="num">404</div>
  <h1>Página no encontrada</h1>
  <p>La URL que buscas no existe o fue movida. Verifica el enlace o vuelve al inicio.</p>
  <div class="btns">
    <a class="btn btn-primary" href="landing.html">Ir al inicio</a>
    <a class="btn btn-secondary" id="back-btn" href="dashboard.html">Ir al Dashboard</a>
  </div>
<script>
(function(){
  try{
    var s=JSON.parse(sessionStorage.getItem('kl_s')||localStorage.getItem('kl_s')||'null');
    if(!s) document.getElementById('back-btn').href='login.html';
  }catch(e){}
})();
</script>
</body>
</html>
