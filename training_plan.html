        // POST /athlete/log (endpoint existente). Rechaza ante falta de token,
        // error de red o respuesta no-2xx: el llamador NO debe marcar hecha.
        function postLog(assignmentId, v) {
          var token =
            localStorage.getItem('lx_ath_token') ||
            localStorage.getItem('lx_co_token');
          if (!token) return Promise.reject(new Error('no-token'));
          var api =
            window.location.protocol === 'file:'
              ? 'http://localhost:8000/api'
              : window.location.origin + '/api';
          return fetch(api + '/athlete/log', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + token,
            },
            body: JSON.stringify({
              assignment_id: assignmentId,
              tss_real: v.tss || null,
              dist_real: v.dist || null,
              dur_real: v.dur || null,
              rpe: v.rpe || null,
              notas: v.notas || null,
              completado: true,
            }),
          }).then(function (r) {
            if (!r.ok) throw new Error(r.status);
            return r.json();
          });
        }

        // Registra la sesión: primero el servidor (si es del coach) y SOLO si
        // responde bien se marca como hecha en local. Resuelve true/false.
        function commitLog(sessionId, v) {
          if (_logBusy) return Promise.resolve(false);
          var s = findPlanned(sessionId);
          if (!s) return Promise.resolve(false);
          _logBusy = true;
          var send = s.api_assignment_id
            ? postLog(s.api_assignment_id, v)
            : Promise.resolve();
          return send.then(
            function () {
              _logBusy = false;
              var plans = getPlanned();
              var idx = plans.findIndex(function (p) {
                return p.id === sessionId;
              });
              if (idx >= 0) {
                plans[idx].status = 'done';
                plans[idx].tss_real = v.tss || null;
                plans[idx].dist_real = v.dist || null;
                plans[idx].dur_real = v.dur || null;
                plans[idx].rpe = v.rpe || null;
                plans[idx].notas_log = v.notas || null;
                savePlanned(plans);
              }
              closeModal('modal-log');
              closeModal('modal-detail');
              render();
              logToast(_t('tp_log_ok', 'Sesión registrada'));
              return true;
            },
            function () {
              _logBusy = false;
              logToast(
                _t(
                  'tp_log_fail',
                  'No se pudo registrar la sesión. Revisa tu conexión e inténtalo de nuevo.',
                ),
              );
              return false;
            },
          );
        }

        // Un gesto: usa los valores de la propia sesión planificada.
        // RPE y notas quedan vacíos (no se inventan; van en "Editar detalle").
        window.tpMarkDone = function (sessionId) {
          var s = findPlanned(sessionId);
          if (!s) return Promise.resolve(false);
          return commitLog(sessionId, {
            tss: s.tss || null,
            dist: s.dist_km || null,
            dur: s.dur_min ? Math.round(s.dur_min) : null,
            rpe: null,
            notas: null,
          });
        };

        // Formulario completo ("Editar detalle"). Precarga el plan, o los
        // valores ya registrados si la sesión está hecha.
        window.openLogModal = function (sessionId) {
          _logTargetId = sessionId;
          var s = findPlanned(sessionId);
          if (!s) return;
          var done = s.status === 'done';
          var rpe = (done && s.rpe) || 5;
          document.getElementById('log-title').textContent =
            'Registrar — ' + s.name;
          document.getElementById('log-tss').value =
            (done ? s.tss_real : s.tss) || '';
          document.getElementById('log-dist').value =
            (done ? s.dist_real : s.dist_km) || '';
          document.getElementById('log-dur').value =
            (done ? s.dur_real : s.dur_min) || '';
          document.getElementById('log-rpe').value = rpe;
          document.getElementById('log-rpe-val').textContent = rpe;
          document.getElementById('log-rpe-label').textContent =
            rpeLabels()[rpe];
          document.getElementById('log-rpe-label').style.color =
            RPE_COLORS[rpe];
          document.getElementById('log-notas').value =
            (done && s.notas_log) || '';
          closeModal('modal-detail');
          document.getElementById('modal-log').classList.add('open');
        };

        document.addEventListener('DOMContentLoaded', function () {
          var slider = document.getElementById('log-rpe');
          if (slider) {
            slider.addEventListener('input', function () {
              var v = parseInt(this.value);
              document.getElementById('log-rpe-val').textContent = v;
              document.getElementById('log-rpe-val').style.color =
                RPE_COLORS[v] || 'var(--orange)';
              document.getElementById('log-rpe-label').textContent =
                rpeLabels()[v] || '';
              document.getElementById('log-rpe-label').style.color =
                RPE_COLORS[v] || 'var(--muted)';
            });
          }
        });

        window.submitLog = function () {
          if (!_logTargetId) return;
          commitLog(_logTargetId, {
            tss: parseInt(document.getElementById('log-tss').value) || null,
            dist: parseFloat(document.getElementById('log-dist').value) || null,
            dur: parseInt(document.getElementById('log-dur').value) || null,
            rpe: parseInt(document.getElementById('log-rpe').value) || null,
            notas: document.getElementById('log-notas').value.trim() || null,
          });
        };


        // ──────────────────────────────────────
        // COACH API INTEGRATION
        // Pull assigned workouts and merge into local plan
        // Usa lx_ath_token (cuenta atleta) si existe, sino lx_co_token (coach)
        // ──────────────────────────────────────
        (function () {
          var CO_API =
            window.location.protocol === 'file:'
              ? 'http://localhost:8000/api'
              : window.location.origin + '/api';
          // Preferir el token del atleta vinculado (lx_ath_token); fallback al coach
          var CO_TOKEN =
            localStorage.getItem('lx_ath_token') ||
            localStorage.getItem('lx_co_token');
          if (!CO_TOKEN) return;

          function coGet(path) {
            return fetch(CO_API + path, {
              headers: { Authorization: 'Bearer ' + CO_TOKEN },
            }).then(function (r) {
              if (!r.ok) throw new Error(r.status);
              return r.json();
            });
          }
          function coPost(path, body) {
            return fetch(CO_API + path, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + CO_TOKEN,
              },
              body: JSON.stringify(body),
            }).then(function (r) {
              if (!r.ok) throw new Error(r.status);
              return r.json();
            });
          }

          // Fetch window and merge into localStorage planned sessions.
          // Arranca en el lunes de esta semana (no en "hoy") para que los días ya
          // transcurridos de la semana actual también entren — si no, el cálculo de
          // Cumplimiento Semanal nunca ve el plan de lunes-viernes al abrir la
          // página un sábado, y esos deportes quedan sin plan detectado.
          function pullAssignments() {
            var now = new Date();
            var dow = now.getDay();
            var mon = new Date(now);
            mon.setDate(now.getDate() - (dow === 0 ? 6 : dow - 1));
            // Ventana amplia hacia ATRÁS y hacia adelante — antes solo miraba desde
            // el lunes de la semana actual en adelante. Efecto real (bug reportado
            // por un usuario, persistía incluso después de refrescar la página):
            // una asignación de una semana YA PASADA que el coach borró/editó
            // nunca se volvía a revisar una vez que esa semana quedaba atrás del
            // lunes actual — quedaba pegada en localStorage PARA SIEMPRE, sin
            // importar cuántas veces se recargara la página, porque localStorage
            // no es parte de ningún caché HTTP/de página que un refresh limpie.
            var start = new Date(mon);
            start.setDate(start.getDate() - 90);
            var end = new Date(Date.now() + 60 * 24 * 3600 * 1000);
            var startIso = start.toISOString().slice(0, 10);
            var endIso = end.toISOString().slice(0, 10);
            coGet('/athlete/plan?start=' + startIso + '&end=' + endIso)
              .then(function (assignments) {
                assignments = assignments || [];
                var raw = localStorage.getItem('kl_training_plan');
                var plan = [];
                try {
                  if (raw) plan = JSON.parse(raw);
                } catch (e) {}

                // Mapeo de deporte de la plantilla del coach → claves swim/bike/run/str
                // que usa esta página. El backend (plan_builder_routes.py: SPORTS)
                // usa "strength", no "str" — sin esta entrada, cualquier sesión de
                // fuerza asignada caía al default ||'run' y se contaba como Carrera,
                // dejando además a Fuerza siempre en "Sin datos".
                var sportMap = {
                  swim: 'swim',
                  bike: 'bike',
                  run: 'run',
                  strength: 'str',
                };

                var changed = false;
                var freshIds = {};
                assignments.forEach(function (a) {
                  var mappedSport = sportMap[a.template.sport];
                  if (!mappedSport) return; // brick/rest/other: no soportado por Cumplimiento Semanal, no inventar deporte
                  freshIds[a.id] = true;

                  var existing = plan.find(function (s) {
                    return s.api_assignment_id === a.id;
                  });
                  var fresh = {
                    id: 'api_' + a.id,
                    api_assignment_id: a.id,
                    name: a.template.nombre,
                    sport: mappedSport,
                    date_iso: a.date_iso,
                    dur_min: a.template.dur_min,
                    dist_km: a.template.dist_km,
                    tss: a.template.tss,
                    notes: a.template.notas || a.notas || '',
                    blocks_json: a.template.blocks_json || null,
                    status: 'planned',
                    source: 'api',
                  };
                  if (existing) {
                    // Refrescar en el lugar: si el coach editó el template (TSS,
                    // deporte, distancia, etc) después de la primera carga, el valor
                    // cacheado en localStorage quedaba pegado para siempre y el
                    // Cumplimiento Semanal de esta página no coincidía con el
                    // Dashboard (que recalcula en vivo sin caché).
                    var keys = Object.keys(fresh);
                    var diff = keys.some(function (k) {
                      return (
                        JSON.stringify(existing[k]) !== JSON.stringify(fresh[k])
                      );
                    });
                    if (diff) {
                      Object.assign(existing, fresh);
                      changed = true;
                    }
                  } else {
                    plan.push(fresh);
                    changed = true;
                  }
                });

                // Reconciliar: cualquier entrada cacheada con api_assignment_id cuya
                // fecha cae DENTRO de esta ventana revisada, pero que ya NO viene en
                // la respuesta fresca del servidor (el coach la borró/canceló), se
                // elimina acá. Antes nunca se eliminaba nada — solo se agregaba o
                // actualizaba — así que un assignment borrado en el backend seguía
                // apareciendo en el calendario del atleta indefinidamente.
                var before = plan.length;
                plan = plan.filter(function (s) {
                  if (!s.api_assignment_id) return true; // no es un assignment del coach, no tocar
                  if (s.date_iso < startIso || s.date_iso > endIso) return true; // fuera de la ventana revisada, no tocar
                  return !!freshIds[s.api_assignment_id];
                });
                if (plan.length !== before) changed = true;

                if (changed) {
                  localStorage.setItem(
                    'kl_training_plan',
                    JSON.stringify(plan),
                  );
                  render();
                }
              })
              .catch(function (e) {
                // Antes esto fallaba en silencio — si /athlete/plan fallaba por
                // cualquier motivo (red, CORS, lo que sea) la reconciliación de
                // arriba nunca corría y entradas viejas quedaban pegadas en
                // localStorage sin ningún rastro visible del porqué.
                console.error(
                  'pullAssignments: no se pudo reconciliar el plan del coach',
                  e,
                );
              });
          }

          pullAssignments();

        })();

        // ──────────────────────────────────────
        // AVISO ADAPTATIVO (S14) — reemplaza la sección incrustada que
        // S10 dejó dentro de "Ver más" (iframe a adaptive.html). El motor
        // (api/routes/adaptive_routes.py) y adaptive.html NO se tocan:
        // esto solo consulta GET /adaptive/signal/{hoy} (mismo endpoint
        // que ya usa adaptive.html) y, si hay un ajuste real, muestra un
        // aviso descartable arriba de la lista de sesiones.
        //
        // "Hay ajuste real" = signal.signal !== 'maintain' (ese es
        // exactamente el valor neutro que ya calcula el motor en
        // _signal(), ver adaptive_routes.py) Y todavía no fue aceptado
        // (signal.accepted !== true, para no re-mostrar un ajuste que el
        // propio atleta ya aplicó en una carga anterior).
        //
        // "Ahora no" es deliberadamente solo local (no llama
        // POST /adaptive/reject): el pedido original distingue "Aplicar
        // ajuste" (acción real sobre el motor, un solo POST accept) de
        // "Ahora no" (ocultar el aviso de HOY sin tocar el backend) —
        // mañana, si la señal sigue proponiendo, el aviso vuelve.
        //
        // Falla silenciosa: sin token, 403 (plan sin acceso a "adaptive",
        // mismo require_feature que protege adaptive.html), 404/500 o
        // error de red -> la página queda exactamente como hoy, sin aviso
        // y sin nada roto.
        // ──────────────────────────────────────
        (function () {
          var API =
            window.location.protocol === 'file:'
              ? 'http://localhost:8000/api'
              : window.location.origin + '/api';
          var TOKEN =
            localStorage.getItem('lx_ath_token') ||
            localStorage.getItem('lx_co_token');
          if (!TOKEN) return;

          var ADP_DISMISS_KEY = 'kl_adp_dismissed_date';
          var dateIso = todayIso();

          function dismissedToday() {
            try {
              return localStorage.getItem(ADP_DISMISS_KEY) === dateIso;
            } catch (e) {
              return false;
            }
          }
          function dismissToday() {
            try {
              localStorage.setItem(ADP_DISMISS_KEY, dateIso);
            } catch (e) {}
          }

          function hideAdpBanner() {
            var el = document.getElementById('adp-banner');
            if (el) el.style.display = 'none';
          }

          if (dismissedToday()) return;

          fetch(API + '/adaptive/signal/' + dateIso, {
            headers: { Authorization: 'Bearer ' + TOKEN },
          })
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .then(function (signal) {
              if (!signal) return; // 403/404/etc — sin acceso o sin datos, sin aviso
              if (!signal.signal || signal.signal === 'maintain') return;
              if (signal.accepted === true) return;

              var el = document.getElementById('adp-banner');
              var txt = document.getElementById('adp-banner-text');
              var err = document.getElementById('adp-banner-err');
              var applyBtn = document.getElementById('adp-banner-apply');
              var dismissBtn = document.getElementById('adp-banner-dismiss');
              if (!el || !txt || !applyBtn || !dismissBtn) return;

              txt.textContent = signal.reason_text || signal.signal_label || '';
              el.style.display = 'flex';

              var busy = false;
              applyBtn.onclick = function () {
                if (busy) return;
                busy = true;
                applyBtn.disabled = true;
                if (err) err.style.display = 'none';
                fetch(API + '/adaptive/accept/' + dateIso, {
                  method: 'POST',
                  headers: { Authorization: 'Bearer ' + TOKEN },
                })
                  .then(function (r) {
                    if (!r.ok) throw new Error('status ' + r.status);
                    return r.json();
                  })
                  .then(function () {
                    hideAdpBanner();
                    if (typeof window._tpRender === 'function')
                      window._tpRender();
                  })
                  .catch(function () {
                    busy = false;
                    applyBtn.disabled = false;
                    if (err) {
                      err.textContent = _t(
                        'adp_banner_err',
                        'No se pudo aplicar el ajuste. Intenta de nuevo.',
                      );
                      err.style.display = 'block';
                    }
                  });
              };

              dismissBtn.onclick = function () {
                dismissToday();
                hideAdpBanner();
              };
            })
            .catch(function () {
              // red/CORS/lo que sea — misma falla silenciosa que un 403/500.
            });
        })();

        // ── Zwift .zwo download (called from showDetail) ──────────────
        window.tpDownloadZwo = function (blocksJson, name, dateIso) {
          var blocks;
          try {
            blocks =
              typeof blocksJson === 'string'
                ? JSON.parse(blocksJson)
                : blocksJson;
          } catch (e) {
            alert(
              _t(
                'tp_alert_workout_read_error',
                'Error al leer los bloques del workout',
              ),
            );
            return;
          }
          if (!blocks || !blocks.length) {
            alert(
              _t(
                'tp_alert_workout_no_blocks',
                'Este workout no tiene estructura de bloques.',
              ),
            );
            return;
          }

          function xEsc(s) {
            return String(s || '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;');
          }

          var lines = [];
          lines.push('<?xml version="1.0" encoding="utf-8"?>');
          lines.push('<workout_file>');
          lines.push('  <author>LabX Coach</author>');
          lines.push('  <name>' + xEsc(name || 'Workout') + '</name>');
          lines.push('  <description>' + (dateIso || '') + '</description>');
          lines.push('  <sportType>bike</sportType>');
          lines.push('  <tags/>');
          lines.push('  <workout>');

          blocks.forEach(function (b) {
            var d = b.duration || 300;
            switch (b.type) {
              case 'warmup':
                lines.push(
                  '    <Warmup Duration="' +
                    d +
                    '" PowerLow="' +
                    (b.power_low || 0.5).toFixed(2) +
                    '" PowerHigh="' +
                    (b.power_high || 0.75).toFixed(2) +
                    '"/>',
                );
                break;
              case 'cooldown':
                lines.push(
                  '    <Cooldown Duration="' +
                    d +
                    '" PowerLow="' +
                    (b.power_high || 0.75).toFixed(2) +
                    '" PowerHigh="' +
                    (b.power_low || 0.4).toFixed(2) +
                    '"/>',
                );
                break;
              case 'steady':
                lines.push(
                  '    <SteadyState Duration="' +
                    d +
                    '" Power="' +
                    (b.power || 0.75).toFixed(2) +
                    '"/>',
                );
                break;
              case 'intervals':
                lines.push(
                  '    <IntervalsT Repeat="' +
                    (b.repeat || 1) +
                    '" OnDuration="' +
                    (b.on_duration || 240) +
                    '" OffDuration="' +
                    (b.off_duration || 120) +
                    '" OnPower="' +
                    (b.on_power || 0.95).toFixed(2) +
                    '" OffPower="' +
                    (b.off_power || 0.55).toFixed(2) +
                    '" pace="0"/>',
                );
                break;
              case 'ramp':
                lines.push(
                  '    <Ramp Duration="' +
                    d +
                    '" PowerLow="' +
                    (b.power_low || 0.6).toFixed(2) +
                    '" PowerHigh="' +
                    (b.power_high || 1.0).toFixed(2) +
                    '"/>',
                );
                break;
              case 'freeride':
                lines.push('    <FreeRide Duration="' + d + '" FlatRoad="0"/>');
                break;
            }
          });

          lines.push('  </workout>');
          lines.push('</workout_file>');

          var xml = lines.join('\n');
          var safe = (name || 'workout')
            .replace(/[^a-z0-9_-]/gi, '_')
            .replace(/_+/g, '_');
          var fname = safe + (dateIso ? '_' + dateIso : '') + '.zwo';
          var blob = new Blob([xml], { type: 'application/xml' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = fname;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () {
            URL.revokeObjectURL(a.href);
          }, 2000);

          /* Toast instrucciones */
          var msg = document.createElement('div');
          msg.style.cssText =
            'position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);z-index:9999;background:#0C1D30;border:1px solid rgba(255,101,53,.4);color:#FF6535;font-family:Oswald,sans-serif;font-size:.78rem;font-weight:600;letter-spacing:.06em;padding:.6rem 1.2rem;border-radius:20px;text-align:center;max-width:420px;pointer-events:none';
          msg.innerHTML =
            '\u{1F4E5} ' +
            fname +
            ' ' +
            _t('tp_downloaded', 'descargado') +
            '<br><span style="font-size:.65rem;color:var(--lxt-7fb3cc,#7FB3CC);font-weight:400">' +
            _t(
              'tp_zwift_copy',
              'Cópialo a <strong>Documentos\\Zwift\\Workouts\\</strong> → aparece en Training → My Workouts',
            ) +
            '</span>';
          document.body.appendChild(msg);
          setTimeout(function () {
            if (msg.parentNode) msg.parentNode.removeChild(msg);
          }, 6000);
        };
      })();
    </script>
    <!-- Bridge: carga actividades Garmin actualizadas desde /api/athlete/dashboard -->
    <script>
      (function () {
        var tok = localStorage.getItem('lx_co_token');
        if (!tok) {
          try {
            var s = JSON.parse(
              sessionStorage.getItem('kl_s') ||
                localStorage.getItem('kl_s') ||
                'null',
            );
            if (s && s.token) tok = s.token;
          } catch (e) {}
        }
        if (!tok) return;

        var API =
          window.location.protocol === 'file:'
            ? 'http://localhost:8000/api'
            : window.location.origin + '/api';

        // FTP/FCMax del atleta — mismos globals y misma fuente (/athlete/profile)
        // que usa dashboard.html, para que estTSS() estime igual en ambas páginas.
        fetch(API + '/athlete/profile', {
          headers: { Authorization: 'Bearer ' + tok },
        })
          .then(function (r) {
            return r.ok ? r.json() : null;
          })
          .then(function (profile) {
            if (!profile) return;
            window._athleteFTP = profile.ftp || null;
            window._athleteFCMax = profile.fcmax || null;
            if (typeof window._tpRender === 'function') window._tpRender();
          })
          .catch(function () {});

        fetch(API + '/athlete/dashboard', {
          headers: { Authorization: 'Bearer ' + tok },
        })
          .then(function (r) {
            return r.ok ? r.json() : null;
          })
          .then(function (data) {
            if (!data) return;
            var swimWords = /nata|swim|piscina|pool/i;

            if (data.activities && data.activities.length) {
              // Normalizar sport para training_plan: gym→str, detectar natación por nombre
              data.activities.forEach(function (a) {
                if (a.sport === 'gym') a.sport = 'str';
                if (a.sport === 'other' && swimWords.test(a.name || ''))
                  a.sport = 'swim';
              });
              window.KL_DATA = window.KL_DATA || {};
              window.KL_DATA.activities = data.activities;
            }

            if (typeof window._tpRender === 'function') window._tpRender();
          })
          .catch(function () {});
      })();
    </script>
