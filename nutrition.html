    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --swim: #06b6d4;
        --bike: #f59e0b;
        --run: #10b981;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        overflow-x: hidden;
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%230891b2' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      ul {
        list-style: none;
      }

      .c {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 clamp(1.25rem, 4vw, 2.5rem);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        font-family: 'Oswald', sans-serif;
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 0.7rem 1.5rem;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        transition: all var(--ease);
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .rt {
        background: none;
        border: none;
        cursor: pointer;
        font-family: 'Oswald', sans-serif;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 0.34rem 0.78rem;
        border-radius: 5px;
        color: var(--dim);
        transition: all var(--ease);
        white-space: nowrap;
      }

      .rt.on {
        background: var(--orange);
        color: #fff;
        box-shadow: 0 2px 12px rgba(255, 101, 53, 0.3);
      }

      .rt:hover:not(.on) {
        color: var(--muted);
        background: rgba(255, 255, 255, 0.04);
      }

      .tab-btn.on {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
      }

      .tab-pane.on {
        display: block;
      }

      footer {
        border-top: 1px solid var(--border2);
        padding: 1.5rem 0;
        text-align: center;
      }

      footer div {
        font-family: 'Oswald', sans-serif;
        font-size: 0.7rem;
        color: var(--dim);
        letter-spacing: 0.1em;
      }

      /* Botón principal (mismo patrón que athlete_profile.html) */
      .btn-primary {
        background: var(--orange);
        color: #fff;
        text-decoration: none;
      }
      .btn-primary:hover {
        background: var(--orange2);
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(255, 101, 53, 0.3);
      }
      /* Estados de la tarjeta de carrera */
      .nut-state {
        padding: 1rem 1.2rem;
        margin-bottom: 1rem;
      }
      .nut-state-title {
        font-weight: 700;
        margin-bottom: 0.7rem;
      }
      .nut-skel {
        height: 0.9rem;
        border-radius: 4px;
        background: var(--surface2);
        margin-top: 0.5rem;
        width: 60%;
        animation: nut-pulse 1.2s ease-in-out infinite;
      }
      @keyframes nut-pulse {
        50% {
          opacity: 0.4;
        }
      }
    </style>
    <link rel="stylesheet" href="nav.css?v=3" />

  <body>
    <!-- SIDEBAR -->
    <aside id="sidebar"></aside>
    <header class="sb-topbar"></header>
    <div class="sb-overlay" id="sb-overlay"></div>

    <main style="max-width: 920px; margin: 0 auto; padding: 1.5rem 1rem">
      <h1
        style="
          font-family: 'Barlow Condensed', sans-serif;
          font-size: 1.6rem;
          margin-bottom: 0.8rem;
        "
        data-i18n="nut_page_title"
      >
        Nutrición de carrera
      </h1>
      <div id="race-src-card-host"></div>
      <div id="nut-footer-links">
        <p
          style="font-size: 0.85rem; color: var(--dim); margin-bottom: 1rem"
          data-i18n="nut_race_src_note"
        >
          El plan de nutrición se calcula y se edita en Race Day, por carrera.
        </p>
        <a
          class="btn btn-primary"
          href="race_day.html"
          data-i18n="nut_race_src_edit"
          >Editar en Race Day →</a
        >
      </div>
    </main>

    <script src="auth.js"></script>

      KL.guard('nutrition');
    </script>
    <script src="nav.js?v=5"></script>
    <script src="footer.js"></script>
    <script src="dash-header.js"></script>
    <script src="lx-upgrade.js"></script>
    <script src="i18n.js"></script>
    <script>
      /* B6: fuente única = Race Day. Esta página solo muestra el plan de la carrera más próxima. */
      var NUT_API_BASE =
        window.location.protocol === 'file:'
          ? 'http://localhost:8000/api'
          : window.location.origin + '/api';
      function _t(k, f) {
        var v = window.i18n ? window.i18n.t(k) : null;
        return v && v !== k ? v : f;
      }
      function getNutToken() {
        var t = localStorage.getItem('lx_co_token');
        if (!t) {
          try {
            var s = JSON.parse(
              sessionStorage.getItem('kl_s') ||
                localStorage.getItem('kl_s') ||
                'null',
            );
            if (s && s.token) t = s.token;
          } catch (e) {}
        }
        return t;
      }
      function nutEsc(x) {
        return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
          }[c];
        });
      }
      /* Estados visibles de la tarjeta: loading | empty | error | ok. Nada falla en silencio. */
      function nutShow(state, d) {
        var host = document.getElementById('race-src-card-host');
        var links = document.getElementById('nut-footer-links');
        if (!host) return;
        if (links) links.style.display = state === 'empty' ? 'none' : '';
        var box = function (inner) {
          return (
            '<div class="panel nut-state" id="race-src-card" data-state="' +
            state +
            '">' +
            inner +
            '</div>'
          );
        };
        if (state === 'loading') {
          host.innerHTML = box(
            '<div role="status" aria-live="polite" style="font-size:.85rem;color:var(--dim)">' +
              _t('nut_loading', 'Cargando tu plan de carrera…') +
              '</div><div class="nut-skel"></div><div class="nut-skel" style="width:40%"></div>',
          );
        } else if (state === 'empty') {
          host.innerHTML = box(
            '<div class="nut-state-title">' +
              _t(
                'nut_empty_title',
                'Aún no hay una próxima carrera con su plan',
              ) +
              '</div><a class="btn btn-primary" href="race_day.html">' +
              _t('nut_empty_btn', 'Ir a Race Day →') +
              '</a>',
          );
        } else if (state === 'error') {
          host.innerHTML = box(
            '<div role="alert" class="nut-state-title">' +
              _t('nut_err_title', 'No pudimos cargar tu plan de carrera') +
              '</div><button type="button" class="btn btn-primary" id="nut-retry">' +
              _t('nut_err_retry', 'Reintentar') +
              '</button>',
          );
          var rb = document.getElementById('nut-retry');
          if (rb) rb.addEventListener('click', loadNutritionPlanFromAPI);
        } else {
          var s = d.nutrition.strategy;
          host.innerHTML =
            '<div class="panel" id="race-src-card" data-state="ok" style="padding:1rem 1.2rem;margin-bottom:1rem">' +
            '<div style="font-weight:700">' +
            _t('nut_race_src_title', 'Plan de carrera (Race Day)') +
            ': ' +
            nutEsc(d.race_name) +
            ' · ' +
            nutEsc(d.race_date) +
            '</div>' +
            '<div style="font-size:.8rem;color:var(--dim);margin-top:.3rem">' +
            _t('nut_race_src_carb', 'Carbohidratos') +
            ' ' +
            nutEsc(s.carb_g_h) +
            ' g/h · ' +
            _t('nut_race_src_total', 'total') +
            ' ' +
            nutEsc(s.total_carb_g) +
            ' g · ' +
            _t('nut_race_src_fluid', 'fluidos') +
            ' ' +
            nutEsc(s.total_fluid_l) +
            ' L · ' +
            nutEsc(s.calories_estimate) +
            ' kcal' +
            '</div></div>';
        }
      }
      function loadNutritionPlanFromAPI() {
        var tok = getNutToken();
        if (!tok) return nutShow('error');
        nutShow('loading');
        fetch(NUT_API_BASE + '/races/nutrition/latest', {
          headers: { Authorization: 'Bearer ' + tok },
        })
          .then(function (r) {
            /* 404 = el atleta no tiene carreras: es "sin datos", no un fallo. */
            if (r.status === 404) return null;
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          })
          .then(function (d) {
            if (!d || !d.nutrition || !d.nutrition.strategy)
              return nutShow('empty');
            nutShow('ok', d);
          })
          .catch(function () {
            nutShow('error');
          });
      }
      loadNutritionPlanFromAPI();
    </script>
    <script src="lx-info.js"></script>
    <script src="lx-audit.js"></script>
