<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04080F;--surface:#08121E;--surface2:#0C1D30;
  --border:rgba(8,116,174,.18);--border2:rgba(8,116,174,.10);
  --orange:#FF6535;--orange2:#E8490A;--gold:#F0A500;--coral:#FF8C61;
  --cyan:#0EA5E9;--aqua:#22D3EE;--green:#10B981;--red:#EF4444;--purple:#A855F7;
  --text:#F0F9FF;--muted:#7FB3CC;--dim:#3D6880;
  --radius:12px;--radius-sm:8px;--ease:220ms cubic-bezier(.4,0,.2,1);
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}ul{list-style:none}
.c{max-width:1280px;margin:0 auto;padding:0 clamp(1rem,4vw,2.5rem)}
.badge{display:inline-block;font-family:'Oswald',sans-serif;font-size:.65rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .55rem;border-radius:4px}
.b-o{background:rgba(255,101,53,.12);color:var(--orange);border:1px solid rgba(255,101,53,.25)}
.b-g{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.25)}
.b-c{background:rgba(14,165,233,.12);color:var(--cyan);border:1px solid rgba(14,165,233,.25)}
.b-p{background:rgba(168,85,247,.12);color:var(--purple);border:1px solid rgba(168,85,247,.25)}

/* ── ACTIVITY HEADER ── */
.ah{padding-top:1.5rem;background:linear-gradient(180deg,#060E1C 0%,var(--bg) 100%);border-bottom:1px solid var(--border2)}
.ah-inner{padding:1.5rem 0}
.back-btn{display:inline-flex;align-items:center;gap:.4rem;font-family:'Oswald',sans-serif;font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:1.1rem;transition:color var(--ease);cursor:pointer}
.back-btn:hover{color:var(--muted)}
.back-btn svg{width:14px;height:14px}
.ah-title{font-family:'Barlow Condensed',sans-serif;font-size:clamp(1.9rem,4vw,3rem);font-weight:800;line-height:1;letter-spacing:.02em;margin-bottom:.55rem}
.ah-meta{display:flex;align-items:center;gap:.65rem;font-family:'Oswald',sans-serif;font-size:.77rem;color:var(--muted);letter-spacing:.06em;flex-wrap:wrap;margin-bottom:1.25rem}
.ah-meta-sep{color:var(--dim)}
.ah-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border2);border-radius:var(--radius);overflow:hidden}
@media(max-width:640px){.ah-stats{grid-template-columns:repeat(2,1fr)}}
.ah-stat{background:var(--surface);padding:1rem 1.25rem}
.ah-stat-lbl{font-family:'Oswald',sans-serif;font-size:.66rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:.2rem}
.ah-stat-val{font-family:'Barlow Condensed',sans-serif;font-size:1.75rem;font-weight:800;line-height:1}
.ah-stat-unit{font-family:'Oswald',sans-serif;font-size:.68rem;color:var(--muted);margin-top:.08rem}

/* ── MAIN ── */
.main{padding:1.75rem 0 4rem}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.panel-head{padding:1rem 1.4rem;border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.panel-title{font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.mt2{margin-top:1.5rem}

/* ── MAP ── */
.map-wrap{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
#map-leaflet{height:320px;background:#04080F}
/* Dark map overlay: dim Leaflet's light controls */
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--muted)!important;border-color:var(--border)!important}
.leaflet-control-zoom a:hover{background:var(--surface2)!important;color:var(--text)!important}
.leaflet-control-attribution{background:rgba(4,8,15,.65)!important;color:var(--dim)!important;font-size:.58rem!important}
.leaflet-control-attribution a{color:var(--dim)!important}
.map-badge{position:absolute;top:10px;left:12px;z-index:500;background:rgba(4,8,15,.82);border:1px solid var(--border);border-radius:6px;padding:.4rem .75rem;font-family:'Oswald',sans-serif;font-size:.7rem;color:var(--muted);letter-spacing:.06em;line-height:1.75;backdrop-filter:blur(6px)}
.map-badge strong{color:var(--text);display:block;font-size:.78rem;margin-bottom:.15rem}
.map-outdoor-label{position:absolute;bottom:10px;right:12px;z-index:500;background:rgba(4,8,15,.82);border:1px solid var(--border);border-radius:6px;padding:.35rem .7rem;font-family:'Oswald',sans-serif;font-size:.68rem;color:var(--dim);letter-spacing:.08em;backdrop-filter:blur(6px)}
/* Indoor / pool visuals */
.indoor-card{height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:var(--surface);border-radius:var(--radius)}
.indoor-icon{font-size:4rem;opacity:.6}
.indoor-label{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:700;letter-spacing:.05em;color:var(--muted)}
.indoor-sub{font-family:'Oswald',sans-serif;font-size:.78rem;color:var(--dim);letter-spacing:.08em}
.pool-wrap{padding:1.5rem 2rem;background:var(--surface)}
.pool-svg{display:block;width:100%;max-height:260px}

/* ── CHARTS ── */
.chart-block{border-bottom:1px solid var(--border2)}
.chart-block:last-child{border-bottom:none}
.chart-lbl{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.4rem .15rem;flex-wrap:wrap;gap:.5rem}
.chart-name{font-family:'Oswald',sans-serif;font-size:.76rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.chart-anns{display:flex;gap:.9rem;font-family:'Oswald',sans-serif;font-size:.68rem;color:var(--muted);letter-spacing:.06em;flex-wrap:wrap}
.chart-ann{display:flex;align-items:center;gap:.28rem}
.chart-ann-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.chart-svg{display:block;width:100%;height:120px}
.chart-taxis{display:flex;justify-content:space-between;padding:.25rem 1.4rem .75rem;font-family:'Oswald',sans-serif;font-size:.62rem;color:var(--dim);letter-spacing:.05em}

/* ── ZONES ── */
.zone-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border2)}
@media(max-width:640px){.zone-grid{grid-template-columns:1fr}}
.zone-col{background:var(--bg);padding:1.15rem 1.4rem}
.zone-title{font-family:'Oswald',sans-serif;font-size:.76rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.9rem}
.zone-row{display:grid;grid-template-columns:150px 1fr 40px 40px;align-items:center;gap:.5rem;margin-bottom:.6rem}
.zone-name{font-size:.72rem;color:var(--dim);font-family:'Oswald',sans-serif;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zone-bar-bg{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden}
.zone-bar-f{height:100%;border-radius:3px;width:0;transition:width .9s cubic-bezier(.4,0,.2,1)}
.zone-pct{font-family:'Barlow Condensed',sans-serif;font-size:.82rem;font-weight:700;color:var(--text);text-align:right}
.zone-min{font-size:.65rem;color:var(--dim);text-align:right;white-space:nowrap}

/* ── SPLITS ── */
.splits-tbl{width:100%;border-collapse:collapse}
.splits-tbl th{font-family:'Oswald',sans-serif;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:.7rem 1rem;text-align:left;border-bottom:1px solid var(--border2);white-space:nowrap}
.splits-tbl td{padding:.7rem 1rem;font-size:.8rem;border-bottom:1px solid var(--border2)}
.splits-tbl tfoot tr td{font-weight:600;color:var(--muted);border-top:1px solid var(--border2);border-bottom:none}
.splits-tbl tr.best td{background:rgba(255,101,53,.05)}
.splits-tbl tr:hover:not(.best) td{background:rgba(8,116,174,.04)}
.best-lbl{font-size:.65rem;color:var(--orange)}

/* ── EXERCISE LIST (Strength) ── */
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;background:var(--border2)}
.ex-card{background:var(--bg);padding:1rem 1.2rem}
.ex-name{font-family:'Oswald',sans-serif;font-size:.82rem;font-weight:600;letter-spacing:.06em;color:var(--text);margin-bottom:.35rem}
.ex-detail{font-family:'Barlow Condensed',sans-serif;font-size:1.3rem;font-weight:700;color:var(--purple);line-height:1}
.ex-sub{font-size:.68rem;color:var(--dim);margin-top:.1rem}

/* ── NO ACTIVITY STATE ── */
.no-act{padding:4rem 2rem;text-align:center}
.no-act-icon{font-size:3rem;margin-bottom:1rem;opacity:.4}
.no-act-title{font-family:'Barlow Condensed',sans-serif;font-size:1.5rem;font-weight:700;color:var(--muted);margin-bottom:.5rem}
.no-act-sub{font-size:.85rem;color:var(--dim)}

/* ── ANIMATIONS ── */
.sr{opacity:0;transform:translateY(18px);transition:opacity .55s var(--ease),transform .55s var(--ease)}
.vis{opacity:1;transform:none}
</style>

<script>
(function(){
'use strict';

// ─────────────────────────────────────────────────────
// SPORT CONFIG
// ─────────────────────────────────────────────────────
var SPORT = {
  bike: {icon:'🚴', label:'Ciclismo',   color:'var(--orange)', badge:'b-o'},
  run:  {icon:'🏃', label:'Carrera',    color:'var(--green)',  badge:'b-g'},
  swim: {icon:'🏊', label:'Natación',   color:'var(--cyan)',   badge:'b-c'},
  str:  {icon:'💪', label:'Fuerza',     color:'var(--purple)', badge:'b-p'}
};
var MONTHS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

// ─────────────────────────────────────────────────────
// URL PARAM → ACTIVITY LOOKUP
// ─────────────────────────────────────────────────────
function getURLParam(name){
  var m = location.search.match(new RegExp('[?&]'+name+'=([^&]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}

var actId = getURLParam('id');
var activities = (KL_DATA && KL_DATA.activities) || [];

// Find by activity_id (stored as number in JSON)
var ACT = null;
if(actId){
  var idNum = parseFloat(actId);
  for(var i=0;i<activities.length;i++){
    if(activities[i].activity_id == idNum){ ACT = activities[i]; break; }
  }
}
// Fallback: most recent activity
if(!ACT && activities.length){ ACT = activities[0]; }

if(!ACT){
  document.getElementById('no-act-state').style.display = 'block';
  document.getElementById('yr').textContent = new Date().getFullYear();
  return;
}

document.getElementById('act-header').style.display = '';
document.getElementById('act-main').style.display   = '';
document.getElementById('yr').textContent = new Date().getFullYear();

// ─────────────────────────────────────────────────────
// ATHLETE PROFILE (from localStorage or defaults)
// ─────────────────────────────────────────────────────
var ATHLETE = (function(){
  try{ return JSON.parse(localStorage.getItem('kl_athlete_data')||'{}'); }
  catch(e){ return {}; }
})();
var FTP  = ATHLETE.ftp   || 240;
var LTHR = ATHLETE.css   || 168;  // using css field as proxy for LTHR
var CSS  = ATHLETE.css   || 110;  // seg/100m

// ─────────────────────────────────────────────────────
// SEEDED RNG (LCG, reproducible per activity_id)
// ─────────────────────────────────────────────────────
function makeRNG(seed){
  var s = ((Math.abs(seed % 2147483647)) || 54321);
  return function(){
    s = (s * 1664525 + 1013904223) & 0x7fffffff;
    return s / 0x7fffffff;
  };
}

// ─────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────
function fmtDur(min){
  var h=Math.floor(min/60), m=Math.round(min%60);
  return h ? h+'h '+(m?m+'min':'') : m+'min';
}
function fmtPace(secKm){
  var m=Math.floor(secKm/60), s=Math.round(secKm%60);
  return m+':'+(s<10?'0':'')+s+'/km';
}
function fmtPace100(sec100){
  var m=Math.floor(sec100/60), s=Math.round(sec100%60);
  return m+':'+(s<10?'0':'')+s+'/100m';
}
function fmtDate(iso){
  var d=new Date(iso+'T12:00:00');
  return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();
}

// ─────────────────────────────────────────────────────
// ACTIVITY CONFIG: location + type
// ─────────────────────────────────────────────────────
function getActConfig(act){
  var nm = (act.name||'').toLowerCase();
  if(nm.indexOf('zwift')>=0)    return {type:'indoor', icon:'🖥️', location:'Zwift — Indoor Trainer'};
  if(nm.indexOf('piscina')>=0 || act.sport==='swim')
                                return {type:'pool',   icon:'🏊', location:'Piscina'};
  if(act.sport==='str')         return {type:'indoor', icon:'🏋️', location:'Gimnasio'};
  if(nm.indexOf('las condes')>=0 || nm.indexOf('condes')>=0)
    return {type:'outdoor', lat:-33.408, lng:-70.583, location:'Las Condes, Santiago'};
  if(nm.indexOf('colina')>=0)
    return {type:'outdoor', lat:-33.190, lng:-70.695, location:'Colina, Chile'};
  // generic outdoor Santiago
  return {type:'outdoor', lat:-33.450, lng:-70.650, location:'Santiago, Chile'};
}

// ─────────────────────────────────────────────────────
// GPS ROUTE GENERATOR (seeded, sport-specific)
// ─────────────────────────────────────────────────────
function generateRoute(activityId, sport, distKm, baseLat, baseLng){
  var rng  = makeRNG(activityId % 999983);
  var dist = (distKm||10)*1000;
  var step = sport==='bike' ? 220 : sport==='run' ? 70 : 50;
  var n    = Math.min(500, Math.max(25, Math.round(dist/step)));
  var cosLat = Math.cos(baseLat*Math.PI/180);
  var pts  = [[baseLat, baseLng]];
  var bear = rng()*360;

  for(var i=1;i<n;i++){
    var t   = i/n;
    var turn= (rng()-0.5)*(sport==='bike'?14:28);

    if(sport==='bike' && distKm>=40){
      // Mountain ride: outbound north, return south
      var target = t<0.44 ? 10 : t>0.56 ? 178 : bear;
      bear = bear*0.78 + target*0.22 + turn;
    } else {
      // Run / short ride: loose loop
      var loopAngle = t*Math.PI*2;
      var loopBear  = Math.atan2(Math.sin(loopAngle), Math.cos(loopAngle))*180/Math.PI + 90;
      bear = bear*0.72 + loopBear*0.28 + turn;
    }

    var stepDeg = step/111000;
    var lat = pts[i-1][0] + Math.cos(bear*Math.PI/180)*stepDeg;
    var lng = pts[i-1][1] + Math.sin(bear*Math.PI/180)*stepDeg/cosLat;
    pts.push([lat, lng]);
  }
  return pts;
}

// ─────────────────────────────────────────────────────
// RENDER: PAGE HEADER
// ─────────────────────────────────────────────────────
var sp = SPORT[ACT.sport]||SPORT.bike;
document.title = 'LabX — '+(ACT.name||sp.label);
document.getElementById('act-title').textContent = ACT.name||sp.label;

var d = new Date(ACT.date_iso+'T12:00:00');
var durH = Math.floor(ACT.dur_min/60), durM = Math.round(ACT.dur_min%60);
var durStr = durH ? durH+'h '+(durM?durM+'min':'') : durM+'min';

document.getElementById('act-meta').innerHTML =
  '<span>'+sp.icon+' '+sp.label+'</span>'
  +'<span class="ah-meta-sep">·</span>'
  +'<span>'+fmtDate(ACT.date_iso)+'</span>'
  +'<span class="ah-meta-sep">·</span>'
  +'<span>'+durStr+'</span>'
  +(ACT.dist_km?'<span class="ah-meta-sep">·</span><span>'+ACT.dist_km.toFixed(1)+' km</span>':'')
  +(ACT.avg_hr?'<span class="ah-meta-sep">·</span><span>'+ACT.avg_hr+' bpm avg</span>':'')
  +'<span class="ah-meta-sep">·</span>'
  +'<span class="badge '+sp.badge+'">'+sp.label+'</span>';

// KPI Cards (sport-specific)
var kpis = [];
if(ACT.sport==='bike'){
  var np  = ACT.avg_power ? Math.round(ACT.avg_power*1.07) : null;
  var ifv = np ? (np/FTP).toFixed(2) : null;
  var tss = ACT.tss || (np ? Math.round((ACT.dur_min*60*np*ifv)/(FTP*3600)*100) : null);
  var spd = ACT.dist_km ? (ACT.dist_km/(ACT.dur_min/60)).toFixed(1) : null;
  kpis = [
    {lbl:'Potencia NP',    val:np||'—',               unit:'Watts',                  col:'var(--orange)'},
    {lbl:'IF',             val:ifv||'—',               unit:'FTP '+FTP+'W',           col:'var(--gold)'},
    {lbl:'FC Media',       val:ACT.avg_hr||'—',        unit:'bpm',                    col:'var(--coral)'},
    {lbl:'Velocidad Media',val:spd||(ACT.avg_power?Math.round(ACT.avg_power/8):' —'),  unit:'km/h',      col:'var(--aqua)'}
  ];
} else if(ACT.sport==='run'){
  var paceS = ACT.dist_km ? Math.round((ACT.dur_min*60)/ACT.dist_km) : null;
  var cad   = 172 + Math.round((makeRNG(ACT.activity_id)()-0.5)*6);
  kpis = [
    {lbl:'Ritmo Medio',    val:paceS?fmtPace(paceS):'—',    unit:'min/km',    col:'var(--green)'},
    {lbl:'FC Media',       val:ACT.avg_hr||'—',              unit:'bpm',       col:'var(--coral)'},
    {lbl:'Cadencia',       val:cad,                           unit:'pasos/min', col:'var(--gold)'},
    {lbl:'Calorías',       val:ACT.calories||'—',             unit:'kcal',      col:'var(--purple)'}
  ];
} else if(ACT.sport==='swim'){
  var paceSwimS = ACT.swim_pace
    ? (function(s){ var p=s.match(/(\d+):(\d+)/); return p?(+p[1]*60+ +p[2]):null; })(ACT.swim_pace)
    : (ACT.dur_min && ACT.dist_km ? Math.round((ACT.dur_min*60)/(ACT.dist_km*10)) : null);
  var distM = ACT.dist_km ? Math.round(ACT.dist_km*1000) : null;
  kpis = [
    {lbl:'Ritmo Medio',    val:paceSwimS?fmtPace100(paceSwimS):'—',  unit:'min/100m',  col:'var(--cyan)'},

var cfg = getActConfig(ACT);
var mapWrap = document.getElementById('map-wrap');
var leafletMap = null;

function initMap(){
  if(cfg.type==='indoor'){
    mapWrap.innerHTML =
      '<div class="indoor-card">'
      +'<div class="indoor-icon">'+cfg.icon+'</div>'
      +'<div class="indoor-label">'+cfg.location+'</div>'
      +'<div class="indoor-sub">'+(ACT.name||sp.label)+' · '+durStr+(ACT.dist_km?' · '+ACT.dist_km.toFixed(1)+' km':'')+'</div>'
      +'</div>';

  }

  if(cfg.type==='pool'){
    // SVG pool visualization
    var numLanes = ACT.dist_km ? Math.max(2, Math.ceil(ACT.dist_km*10/50)) : 8;
    var laneH = 28, laneW = 700, padX = 60, padY = 30;
    var svgH   = numLanes*laneH + padY*2;
    var svgW   = laneW + padX*2;
    var svg    = '<svg class="pool-svg" viewBox="0 0 '+svgW+' '+svgH+'" xmlns="http://www.w3.org/2000/svg">';
    svg += '<rect width="'+svgW+'" height="'+svgH+'" fill="var(--surface)"/>';
    svg += '<rect x="'+padX+'" y="'+padY+'" width="'+laneW+'" height="'+(numLanes*laneH)+'" rx="4" fill="rgba(14,165,233,.08)" stroke="rgba(14,165,233,.18)" stroke-width="1.5"/>';
    for(var li=0;li<=numLanes;li++){
      var ly = padY + li*laneH;
      svg += '<line x1="'+padX+'" y1="'+ly+'" x2="'+(padX+laneW)+'" y2="'+ly+'" stroke="rgba(14,165,233,.15)" stroke-width="1"/>';
    }
    // Swimmer path animation
    for(var si=0;si<Math.min(numLanes,4);si++){
      var sy = padY + si*laneH + laneH/2;
      var goRight = si%2===0;
      var x1 = padX+8, x2 = padX+laneW-8;
      svg += '<line x1="'+(goRight?x1:x2)+'" y1="'+sy+'" x2="'+(goRight?x2:x1)+'" y2="'+sy+'" stroke="var(--cyan)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>';
      svg += '<circle cx="'+(goRight?x2:x1)+'" cy="'+sy+'" r="5" fill="var(--cyan)" opacity="0.8"/>';
    }
    svg += '<text x="'+(padX-8)+'" y="'+(padY+laneH/2+4)+'" text-anchor="end" fill="var(--dim)" font-size="9" font-family="Oswald,sans-serif">25m</text>';
    if(ACT.dist_km){
      var totalLaps = Math.round(ACT.dist_km*1000/25);
      svg += '<text x="'+(padX+laneW/2)+'" y="'+(svgH-8)+'" text-anchor="middle" fill="var(--muted)" font-size="10" font-family="Oswald,sans-serif" letter-spacing="1">'+totalLaps+' LARGOS · '+(ACT.dist_km*1000).toFixed(0)+'m TOTAL</text>';
    }
    svg += '</svg>';
    mapWrap.innerHTML = '<div class="pool-wrap">'+svg+'</div>';
    return;
  }

  // OUTDOOR: Leaflet map
  mapWrap.innerHTML = '<div id="map-leaflet"></div><div class="map-badge" id="map-badge"></div><div class="map-outdoor-label" id="map-loc"></div>';

  // Build overlay info
  var badge = document.getElementById('map-badge');
  var locEl  = document.getElementById('map-loc');
  if(ACT.sport==='bike' && ACT.avg_power){
    badge.innerHTML = '<strong>'+cfg.location+'</strong>'
      +'⚡ '+ACT.avg_power+'W avg<br>'
      +(ACT.dist_km?'📍 '+ACT.dist_km.toFixed(1)+' km<br>':'')
      +(ACT.avg_hr?'❤️ '+ACT.avg_hr+' bpm':'');
  } else if(ACT.sport==='run'){
    var rPace = ACT.dist_km ? fmtPace(Math.round((ACT.dur_min*60)/ACT.dist_km)) : '—';
    badge.innerHTML = '<strong>'+cfg.location+'</strong>'
      +'🏃 '+rPace+'<br>'
      +(ACT.dist_km?'📍 '+ACT.dist_km.toFixed(1)+' km<br>':'')
      +(ACT.avg_hr?'❤️ '+ACT.avg_hr+' bpm':'');
  }
  locEl.textContent = cfg.location;

  // Initialize Leaflet
  leafletMap = L.map('map-leaflet', {
    zoomControl: true,
    attributionControl: true,
    scrollWheelZoom: false
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(leafletMap);

  // Generate GPS route
  var route = generateRoute(ACT.activity_id, ACT.sport, ACT.dist_km, cfg.lat, cfg.lng);

  // Route color by sport
  var lineColor = ACT.sport==='run' ? '#10B981' : '#FF6535';

  // Draw route glow (thick, transparent)
  L.polyline(route, {color:lineColor, weight:10, opacity:.15}).addTo(leafletMap);
  // Draw route line
  var poly = L.polyline(route, {color:lineColor, weight:3, opacity:.95}).addTo(leafletMap);

  // Fit map to route
  leafletMap.fitBounds(poly.getBounds(), {padding:[28,28]});

  // Custom icon factory
  function circleIcon(color){
    return L.divIcon({
      className:'',
      html:'<div style="width:14px;height:14px;border-radius:50%;background:'+color+';border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5)"></div>',
      iconSize:[14,14], iconAnchor:[7,7]
    });
  }

  L.marker(route[0], {icon: circleIcon('#10B981')})
    .bindPopup('<b>Inicio</b><br>'+cfg.location).addTo(leafletMap);
  L.marker(route[route.length-1], {icon: circleIcon('#EF4444')})
    .bindPopup('<b>Fin</b><br>'+fmtDur(ACT.dur_min)).addTo(leafletMap);

  // Distance markers every N km
  var markerEvery = ACT.dist_km > 50 ? 20 : ACT.dist_km > 20 ? 10 : ACT.dist_km > 5 ? 5 : 2;
  var totalMeters = (ACT.dist_km||0)*1000;
  var stepsPerKm  = route.length / (ACT.dist_km||1);
  for(var mk=markerEvery; mk<(ACT.dist_km||0); mk+=markerEvery){
    var idx = Math.round(mk * stepsPerKm);
    if(idx < route.length){
      L.marker(route[idx], {icon: L.divIcon({
        className:'',
        html:'<div style="font-family:Oswald,sans-serif;font-size:10px;color:#F0A500;background:rgba(4,8,15,.8);padding:1px 5px;border-radius:4px;border:1px solid rgba(240,165,0,.4);white-space:nowrap">'+mk+' km</div>',
        iconAnchor:[20,10]
      })}).addTo(leafletMap);
    }
  }
}

// ─────────────────────────────────────────────────────
// CHART DATA GENERATORS (seeded by activity_id)
// ─────────────────────────────────────────────────────
function genSeries(n, base, amplitude, rng, fn){
  fn = fn || function(t,r){ return base + (r-0.5)*amplitude; };
  var raw = [];
  for(var i=0;i<n;i++) raw.push(fn(i/n, rng()));
  // smooth 3-pass
  for(var p=0;p<3;p++){
    for(var j=1;j<raw.length-1;j++)
      raw[j] = (raw[j-1]+raw[j]*2+raw[j+1])/4;
  }
  return raw;
}

function buildChartData(act){
  var rng = makeRNG(act.activity_id+7);
  var n   = Math.min(200, Math.max(60, act.dur_min*2));

  if(act.sport==='bike'){
    var avgP = act.avg_power || 160;
    var np   = Math.round(avgP*1.07);
    var pow  = genSeries(n, avgP, 80, rng, function(t,r){
      if(t<0.1) return avgP*0.5 + avgP*0.5*t/0.1 + (r-0.5)*20;
      if(t>0.92) return avgP*0.5 + avgP*0.5*(1-t)/0.08 + (r-0.5)*20;
      var blk = Math.floor((t-0.1)/0.1)%2;
      return blk===0 ? avgP*1.12+(r-0.5)*45 : avgP*0.55+(r-0.5)*20;
    });
    var hr = genSeries(n, act.avg_hr||145, 18, rng, function(t,r){
      if(t<0.12) return (act.avg_hr||145)*0.72 + (act.avg_hr||145)*0.28*t/0.12 + (r-0.5)*5;
      return (act.avg_hr||145)*0.9 + (r-0.5)*15 + t*8;
    });
    var isColina = (act.name||'').toLowerCase().indexOf('colina')>=0;
    var altBase  = isColina ? 800 : 450;
    var altRange = isColina ? 900 : 180;
    var alt = genSeries(n, altBase, 60, rng, function(t,r){
      var profile = t<0.45 ? t/0.45 : t<0.55 ? 1 : (1-t)/0.45;
      return altBase + profile*altRange + (r-0.5)*25;
    });
    var spd = pow.map(function(p){ return Math.max(12, Math.min(55, p/8.2 + (rng()-0.5)*3)); });
    return {
      charts:[
        {id:'c-pow', data:pow, color:'#FF6535', label:'Potencia (W)',
         min:0, max:Math.round(Math.max.apply(null,pow)*1.1/50)*50,
         anns:['NP: '+np+'W','Max: '+Math.round(Math.max.apply(null,pow))+'W'],
         annColors:['#FF6535','#EF4444']},
        {id:'c-hr',  data:hr,  color:'#EF4444', label:'Frecuencia Cardíaca (bpm)',
         min:60, max:Math.round(Math.max.apply(null,hr)*1.05),
         anns:['Media: '+Math.round(hr.reduce(function(a,b){return a+b;},0)/hr.length)+'bpm',
               'Max: '+Math.round(Math.max.apply(null,hr))+'bpm'],
         annColors:['#EF4444','#FF8C61']},
        {id:'c-alt', data:alt, color:'#10B981', label:'Altitud (m)', filled:true,
         min:Math.round(Math.min.apply(null,alt)/100)*100,
         max:Math.round(Math.max.apply(null,alt)/100)*100+100,
         anns:['↑ '+Math.round((isColina?altRange*0.95:altRange*0.6))+'m gain'],
         annColors:['#10B981']},
        {id:'c-spd', data:spd, color:'#22D3EE', label:'Velocidad (km/h)',
         min:0, max:60,
         anns:['Media: '+act.dist_km?(act.dist_km/(act.dur_min/60)).toFixed(1)+'km/h':'—',
               'Max: '+Math.round(Math.max.apply(null,spd))+'km/h'],
         annColors:['#22D3EE','#0EA5E9'], taxis: true}
      ],
      powerForZones: pow
    };
  }

  if(act.sport==='run'){
    var avgPaceS = act.dist_km ? Math.round((act.dur_min*60)/act.dist_km) : 300;
    var pace = genSeries(n, avgPaceS, 30, rng, function(t,r){
      if(t<0.08) return avgPaceS*1.18+(r-0.5)*15;
      return avgPaceS*0.97+(r-0.5)*22+t*8;
    });
    var hrR = genSeries(n, act.avg_hr||148, 15, rng, function(t,r){
      return (act.avg_hr||148)*0.88 + t*(act.avg_hr||148)*0.15 + (r-0.5)*8;
    });
    var altR = genSeries(n, 820, 50, rng, function(t,r){
      return 820 + Math.sin(t*Math.PI*3)*45 + (r-0.5)*12;
    });
    var cadR = genSeries(n, 172, 8, rng);
    return {
      charts:[
        {id:'c-pac', data:pace, color:'#10B981', label:'Ritmo (seg/km)', invertY:true,
         min:avgPaceS-60, max:avgPaceS+90,
         anns:[fmtPace(Math.round(pace.reduce(function(a,b){return a+b;},0)/pace.length))],
         annColors:['#10B981']},
        {id:'c-hr',  data:hrR, color:'#EF4444', label:'Frecuencia Cardíaca (bpm)',
         min:80, max:Math.round(Math.max.apply(null,hrR)*1.05),
         anns:['Media: '+Math.round(hrR.reduce(function(a,b){return a+b;},0)/hrR.length)+'bpm'],
         annColors:['#EF4444']},
        {id:'c-alt', data:altR, color:'#22D3EE', label:'Altitud (m)', filled:true,
         min:780, max:900,
         anns:['Las Condes · 820-880m'],
         annColors:['#22D3EE']},
        {id:'c-cad', data:cadR, color:'#A855F7', label:'Cadencia (pasos/min)',
         min:155, max:190,
         anns:['Media: '+Math.round(cadR.reduce(function(a,b){return a+b;},0)/cadR.length)+' spm'],
         annColors:['#A855F7'], taxis:true}
      ],
      hrData: hrR
    };
  }

  if(act.sport==='swim'){
    var paceBase = act.swim_pace
      ? (function(s){ var p=s.match(/(\d+):(\d+)/); return p?(+p[1]*60+ +p[2]):110; })(act.swim_pace)
      : 110;
    var swPace = genSeries(n, paceBase, 12, rng);
    var swHR   = genSeries(n, act.avg_hr||105, 12, rng, function(t,r){
      return (act.avg_hr||105) + t*8 + (r-0.5)*10;
    });
    var swolf  = genSeries(n, 38, 6, rng);
    return {
      charts:[
        {id:'c-pac', data:swPace, color:'#0EA5E9', label:'Ritmo (seg/100m)', invertY:true,
         min:paceBase-20, max:paceBase+30,
         anns:[fmtPace100(Math.round(swPace.reduce(function(a,b){return a+b;},0)/swPace.length))],
         annColors:['#0EA5E9']},
        {id:'c-hr', data:swHR, color:'#EF4444', label:'Frecuencia Cardíaca (bpm)',
         min:80, max:Math.round(Math.max.apply(null,swHR)*1.05),
         anns:['Media: '+Math.round(swHR.reduce(function(a,b){return a+b;},0)/swHR.length)+'bpm'],
         annColors:['#EF4444']},
        {id:'c-swolf', data:swolf, color:'#22D3EE', label:'SWOLF (eficiencia)',
         min:28, max:52,
         anns:['Media: '+Math.round(swolf.reduce(function(a,b){return a+b;},0)/swolf.length)],
         annColors:['#22D3EE'], taxis:true}
      ],
      hrData: swHR
    };
  }

  // Strength: HR only
  var strHR = genSeries(n, act.avg_hr||90, 25, rng, function(t,r){
    var blk = Math.floor(t*6)%2;
    return blk===0 ? (act.avg_hr||90)*1.15+(r-0.5)*15 : (act.avg_hr||90)*0.78+(r-0.5)*8;
  });
  return {
    charts:[
      {id:'c-hr', data:strHR, color:'#EF4444', label:'Frecuencia Cardíaca (bpm)',
       min:50, max:Math.round(Math.max.apply(null,strHR)*1.1),
       anns:['Media: '+Math.round(strHR.reduce(function(a,b){return a+b;},0)/strHR.length)+'bpm',
             'Max: '+Math.round(Math.max.apply(null,strHR))+'bpm'],
       annColors:['#EF4444','#FF8C61'], taxis:true}
    ],
    hrData: strHR
  };
}

// ─────────────────────────────────────────────────────
// SVG CHART RENDERER
// ─────────────────────────────────────────────────────
function drawChart(cfg, parentEl){
  var block = document.createElement('div');
  block.className = 'chart-block';

  // Label row
  var lblDiv = '<div class="chart-lbl">'
    +'<span class="chart-name" style="color:'+cfg.color+'">'+cfg.label+'</span>'
    +'<div class="chart-anns">'
    +cfg.anns.map(function(a,i){
      return '<div class="chart-ann"><div class="chart-ann-dot" style="background:'+(cfg.annColors[i]||cfg.color)+'"></div>'+a+'</div>';
    }).join('')
    +'</div></div>';

  // SVG
  var W=900,H=120,P={l:44,r:10,t:10,b:20};
  var cW=W-P.l-P.r, cH=H-P.t-P.b;
  var data = cfg.data, minV=cfg.min, maxV=cfg.max;
  if(cfg.invertY){ var tmp=minV; minV=maxV; maxV=tmp; }

  function xP(i){ return P.l + (i/(data.length-1))*cW; }
  function yP(v){ return P.t + (1-(v-cfg.min)/(cfg.max-cfg.min))*cH; }

  var html='';
  // Grid lines
  for(var gi=0;gi<=4;gi++){
    var gv = cfg.min + gi*(cfg.max-cfg.min)/4;
    var gy = yP(gv);
    html+='<line x1="'+P.l+'" y1="'+gy+'" x2="'+(W-P.r)+'" y2="'+gy+'" stroke="rgba(8,116,174,.07)" stroke-width="1"/>';
    html+='<text x="'+(P.l-4)+'" y="'+(gy+4)+'" text-anchor="end" font-size="9" fill="#3D6880" font-family="Oswald,sans-serif">'+Math.round(gv)+'</text>';
  }

  // Power zone bands (bike power chart)
  if(cfg.id==='c-pow'){
    var pZones=[[0,FTP*.55,'rgba(61,104,128,.07)'],[FTP*.55,FTP*.75,'rgba(14,165,233,.05)'],
                [FTP*.75,FTP*.9,'rgba(16,185,129,.05)'],[FTP*.9,FTP*1.05,'rgba(240,165,0,.06)'],
                [FTP*1.05,FTP*1.2,'rgba(255,101,53,.07)'],[FTP*1.2,999,'rgba(239,68,68,.07)']];
    pZones.forEach(function(z){
      var y1=Math.max(P.t,yP(Math.min(z[1],cfg.max)));
      var y2=Math.min(H-P.b,yP(Math.max(z[0],cfg.min)));
      if(y2>y1) html+='<rect x="'+P.l+'" y="'+y1+'" width="'+cW+'" height="'+(y2-y1)+'" fill="'+z[2]+'"/>';
    });
  }

  // Area fill
  if(cfg.filled){
    var areaD='M'+xP(0)+','+yP(data[0])+' '+data.slice(1).map(function(v,i){ return 'L'+xP(i+1)+','+yP(v); }).join(' ')
      +' L'+xP(data.length-1)+','+(H-P.b)+' L'+xP(0)+','+(H-P.b)+' Z';
    html+='<defs><linearGradient id="grd-'+cfg.id+'" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0%" stop-color="'+cfg.color+'" stop-opacity=".35"/>'
      +'<stop offset="100%" stop-color="'+cfg.color+'" stop-opacity=".02"/></linearGradient></defs>';
    html+='<path d="'+areaD+'" fill="url(#grd-'+cfg.id+')"/>';
  }

  var pts = data.map(function(v,i){ return xP(i)+','+yP(v); }).join(' ');

  var svgStr = '<svg class="chart-svg" id="'+cfg.id+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+html+'</svg>';

  var taxisStr = '';
  if(cfg.taxis){
    var labels=[]; var steps=6;
    for(var ti=0;ti<=steps;ti++) labels.push(Math.round(ACT.dur_min*ti/steps)+'min');
    taxisStr='<div class="chart-taxis">'+labels.map(function(l){return '<span>'+l+'</span>';}).join('')+'</div>';
  }

  block.innerHTML = lblDiv+svgStr+taxisStr;
  parentEl.appendChild(block);

  // Animated polyline via DOM (cannot use innerHTML for SVG namespace)
  var svg = block.querySelector('#'+cfg.id);
  var line = document.createElementNS('http://www.w3.org/2000/svg','polyline');
  line.setAttribute('points', pts);
  line.setAttribute('fill','none');
  line.setAttribute('stroke', cfg.color);
  line.setAttribute('stroke-width','2');
  line.setAttribute('stroke-linejoin','round');
  svg.appendChild(line);

  var len = line.getTotalLength();
  line.style.strokeDasharray = len;
  line.style.strokeDashoffset= len;
  line.style.transition = 'stroke-dashoffset 1.8s cubic-bezier(.4,0,.2,1)';
  setTimeout(function(){ line.style.strokeDashoffset='0'; },300);
}

function renderZones(){
  var zonesGrid = document.getElementById('zones-grid');
  var dur = ACT.dur_min;

  if(ACT.sport==='bike'){
    var pZoneDef=[
      {lbl:'Z1 Recovery',   pct: 8, col:'#3D6880'},
      {lbl:'Z2 Endurance',  pct:15, col:'var(--cyan)'},
      {lbl:'Z3 Tempo',      pct:20, col:'var(--green)'},
      {lbl:'Z4 Threshold',  pct:38, col:'var(--gold)'},
      {lbl:'Z5 VO₂Max',     pct:14, col:'var(--orange)'},
      {lbl:'Z6 Anaeróbico', pct: 5, col:'var(--red)'}
    ];
    // Adjust based on avg_power vs FTP
    if(ACT.avg_power){
      var ratio = ACT.avg_power/FTP;
      if(ratio<0.6){ pZoneDef[0].pct=25; pZoneDef[1].pct=35; pZoneDef[2].pct=20; pZoneDef[3].pct=12; pZoneDef[4].pct=6; pZoneDef[5].pct=2; }
      else if(ratio>0.85){ pZoneDef[0].pct=5; pZoneDef[1].pct=10; pZoneDef[2].pct=18; pZoneDef[3].pct=42; pZoneDef[4].pct=18; pZoneDef[5].pct=7; }
    }
    var hrZoneDef=[
      {lbl:'Z1 <108bpm',  pct: 5, col:'#3D6880'},
      {lbl:'Z2 108-126',  pct:12, col:'var(--cyan)'},
      {lbl:'Z3 126-144',  pct:20, col:'var(--green)'},
      {lbl:'Z4 144-162',  pct:55, col:'var(--orange)'},
      {lbl:'Z5 >162bpm',  pct: 8, col:'var(--red)'}
    ];
    zonesGrid.innerHTML =
      colHtml('Zonas de Potencia', pZoneDef, dur)
      + colHtml('Zonas de Frecuencia Cardíaca', hrZoneDef, dur);
  } else if(ACT.sport==='run'){
    var hrZR=[
      {lbl:'Z1 Recuperación', pct: 6, col:'#3D6880'},
      {lbl:'Z2 Aeróbico',     pct:45, col:'var(--cyan)'},
      {lbl:'Z3 Tempo',        pct:28, col:'var(--green)'},
      {lbl:'Z4 Umbral',       pct:16, col:'var(--orange)'},
      {lbl:'Z5 Máximo',       pct: 5, col:'var(--red)'}
    ];
    var paceZR=[
      {lbl:'Muy fácil >6:30',  pct: 8, col:'#3D6880'},
      {lbl:'Fácil 6:00-6:30',  pct:38, col:'var(--cyan)'},
      {lbl:'Tempo 5:30-6:00',  pct:30, col:'var(--green)'},
      {lbl:'Umbral 5:00-5:30', pct:18, col:'var(--orange)'},
      {lbl:'Rápido <5:00',     pct: 6, col:'var(--red)'}
    ];
    zonesGrid.innerHTML = colHtml('Zonas de FC',col2(hrZR,dur)) + colHtml2('Zonas de Ritmo', paceZR, dur);
    function col2(z,d){ return z; }
    function colHtml2(t,z,d){ return colHtml(t,z,d); }
  } else {
    var hrZS=[
      {lbl:'Z1 Reposo <80bpm',  pct:15, col:'#3D6880'},
      {lbl:'Z2 Bajo 80-100',    pct:35, col:'var(--cyan)'},
      {lbl:'Z3 Moderado 100-120',pct:32, col:'var(--green)'},
      {lbl:'Z4 Alto 120-140',   pct:14, col:'var(--orange)'},
      {lbl:'Z5 Máximo >140',    pct: 4, col:'var(--red)'}
    ];
    zonesGrid.innerHTML = colHtml('Zonas de FC', hrZS, dur);
    zonesGrid.style.gridTemplateColumns='1fr';
  }

  function colHtml(title, zones, totalMin){
    var html='<div class="zone-col"><div class="zone-title">'+title+'</div>';
    zones.forEach(function(z){
      var min = Math.round(totalMin*z.pct/100);
      html+='<div class="zone-row">'
        +'<div class="zone-name">'+z.lbl+'</div>'
        +'<div class="zone-bar-bg"><div class="zone-bar-f" data-w="'+z.pct+'" style="background:'+z.col+'"></div></div>'
        +'<div class="zone-pct">'+z.pct+'%</div>'
        +'<div class="zone-min">'+min+'min</div>'
        +'</div>';
    });
    return html+'</div>';
  }
}
renderZones();

// ─────────────────────────────────────────────────────
// RENDER: SPLITS / EXERCISE LIST
// ─────────────────────────────────────────────────────
function renderSplits(){
  var rng   = makeRNG(ACT.activity_id + 99);
  var inner = document.getElementById('splits-inner');

  if(ACT.sport==='str'){
    document.getElementById('splits-title').textContent = 'Ejercicios de la Sesión';
    var exercises = [
      {n:'Sentadilla',          sets:'4×8',   peso:'80 kg'},
      {n:'Peso Muerto',         sets:'3×6',   peso:'100 kg'},
      {n:'Press Banca',         sets:'4×10',  peso:'70 kg'},
      {n:'Dominadas',           sets:'3×8',   peso:'Peso Corporal'},
      {n:'Zancadas',            sets:'3×12',  peso:'30 kg c/u'},
      {n:'Plancha',             sets:'3×60s', peso:'—'},
      {n:'Hip Thrust',          sets:'4×12',  peso:'60 kg'},
      {n:'Core Rotacional',     sets:'3×15',  peso:'5 kg'}
    ];
    inner.innerHTML = '<div class="ex-grid">'+exercises.map(function(e){
      return '<div class="ex-card">'
        +'<div class="ex-name">'+e.n+'</div>'
        +'<div class="ex-detail">'+e.sets+'</div>'
        +'<div class="ex-sub">'+e.peso+'</div>'
        +'</div>';
    }).join('')+'</div>';
    return;
  }

  if(ACT.sport==='swim'){
    document.getElementById('splits-title').textContent = 'Parciales por 100m';
    var dist  = ACT.dist_km ? ACT.dist_km*1000 : 1900;
    var nLaps  = Math.round(dist/100);
    var pBase  = ACT.swim_pace
      ? (function(s){var p=s.match(/(\d+):(\d+)/);return p?(+p[1]*60+ +p[2]):110;})(ACT.swim_pace)
      : 110;
    var rows='',best=0,bestT=999;
    for(var li=0;li<nLaps;li++){
      var lapPace = pBase + Math.round((rng()-0.5)*14) + (li>nLaps*0.8?6:0);
      if(lapPace<bestT){bestT=lapPace;best=li;}
      rows+='<tr'+(li===best?' class="best"':'')+'>'
        +'<td>'+(li+1)+(li===best?' <span class="best-lbl">★ Mejor</span>':'')+'</td>'
        +'<td>'+(li*100)+'-'+((li+1)*100)+'m</td>'
        +'<td>'+fmtPace100(lapPace)+'</td>'
        +'<td>'+(30+Math.round(rng()*6))+'</td>'
        +'<td>'+(Math.round(pBase+(rng()-0.5)*8))+'</td>'
        +'</tr>';
    }
    inner.innerHTML='<div style="overflow-x:auto"><table class="splits-tbl">'
      +'<thead><tr><th>Largo</th><th>Metros</th><th>Ritmo</th><th>Brazadas</th><th>SWOLF</th></tr></thead>'
      +'<tbody>'+rows+'</tbody>'
      +'<tfoot><tr><td>TOTAL</td><td>'+Math.round(dist)+'m</td>'
      +'<td style="color:var(--cyan)">'+fmtPace100(pBase)+'</td>'
      +'<td>'+Math.round(32+rng()*4)+'</td><td>'+Math.round(36+rng()*4)+'</td></tr></tfoot>'
      +'</table></div>';
    return;
  }

  // Bike / Run: km splits
  var sport = ACT.sport;
  document.getElementById('splits-title').textContent = 'Parciales por Kilómetro';
  var totalKm = ACT.dist_km || 0;
  var numKm   = Math.round(totalKm);
  if(numKm<1){
    inner.innerHTML='<p style="padding:1.5rem;color:var(--dim);font-size:.82rem">Sin datos de parciales disponibles.</p>';
    return;
  }

  var avgSpd  = totalKm/(ACT.dur_min/60);
  var avgPaceS= sport==='run' ? Math.round((ACT.dur_min*60)/totalKm) : null;
  var avgPow  = ACT.avg_power || null;
  var bestKm=-1, bestVal=sport==='bike'?0:999;
  var rows='';

  for(var ki=1;ki<=numKm;ki++){
    var isWarmup  = ki===1;
    var isCooldown= ki===numKm;
    var kmPow     = avgPow ? Math.round(avgPow*(isWarmup||isCooldown?0.72:1.08+(rng()-0.5)*0.22)):null;
    var kmPace    = avgPaceS ? Math.round(avgPaceS*(isWarmup?1.18:isCooldown?1.12:0.96+(rng()-0.5)*0.12)):null;
    var kmHR      = Math.round((ACT.avg_hr||148)*(isWarmup?0.82:0.98+(rng()-0.5)*0.08));
    var kmSpd     = kmPow ? (kmPow/8.2).toFixed(1) : avgSpd?(avgSpd*0.95+(rng()-0.5)*4).toFixed(1):'—';
    var kmIF      = kmPow ? (kmPow/FTP).toFixed(2) : null;

    if(sport==='bike' && kmPow && kmPow>bestVal){ bestVal=kmPow; bestKm=ki; }
    if(sport==='run'  && kmPace && kmPace<bestVal){ bestVal=kmPace; bestKm=ki; }

    var note = isWarmup?'<span style="color:var(--dim);font-size:.72rem">Calentamiento</span>'
              :isCooldown?'<span style="color:var(--dim);font-size:.72rem">Enfriamiento</span>':'';

    rows+='<tr'+(ki===bestKm?' class="best"':'')+'>';
    rows+='<td>'+ki+(ki===bestKm?' <span class="best-lbl">★</span>':'')+'</td>';
    if(sport==='bike'){
      rows+='<td style="color:var(--orange)">'+(kmPow?kmPow+'W':'—')+'</td>';
      rows+='<td>'+(kmIF||'—')+'</td>';
    } else {
      rows+='<td style="color:var(--green)">'+(kmPace?fmtPace(kmPace):'—')+'</td>';
      rows+='<td style="color:var(--purple)">'+(172+Math.round((rng()-0.5)*8))+'</td>';
    }
    rows+='<td style="color:var(--coral)">'+kmHR+'</td>';
    rows+='<td>'+kmSpd+' km/h</td>';
    rows+='<td>'+note+'</td></tr>';
  }

  var thead = sport==='bike'
    ? '<tr><th>Km</th><th>Potencia</th><th>IF</th><th>FC</th><th>Velocidad</th><th></th></tr>'
    : '<tr><th>Km</th><th>Ritmo</th><th>Cadencia</th><th>FC</th><th>Velocidad</th><th></th></tr>';

  var avgPowStr  = avgPow?avgPow+'W NP':'—';
  var avgPaceStr = avgPaceS?fmtPace(avgPaceS):'—';
  var avgHRStr   = (ACT.avg_hr||'—')+' bpm';

  inner.innerHTML='<div style="overflow-x:auto"><table class="splits-tbl">'
    +'<thead>'+thead+'</thead><tbody>'+rows+'</tbody>'
    +'<tfoot><tr><td>TOTAL</td>'
    +(sport==='bike'?'<td style="color:var(--orange)">'+avgPowStr+'</td><td style="color:var(--gold)">'+(avgPow?(avgPow/FTP).toFixed(2):'—')+'</td>'
                   :'<td style="color:var(--green)">'+avgPaceStr+'</td><td style="color:var(--purple)">172</td>')
    +'<td style="color:var(--coral)">'+avgHRStr+'</td>'
    +'<td>'+(totalKm.toFixed(1))+' km</td><td></td></tr></tfoot>'
    +'</table></div>';
}
renderSplits();

// ─────────────────────────────────────────────────────
// SCROLL ANIMATIONS + ZONE BAR ANIMATION
// ─────────────────────────────────────────────────────
var obs = new IntersectionObserver(function(entries){
  entries.forEach(function(e){
    if(e.isIntersecting){
      e.target.classList.add('vis');
      if(e.target.id==='s-zones'){
        e.target.querySelectorAll('.zone-bar-f[data-w]').forEach(function(b,i){
          setTimeout(function(){ b.style.width = b.dataset.w+'%'; },i*55);
        });
      }
      if(e.target.id==='s-map') initMap();
    }
  });
},{threshold:.05});
document.querySelectorAll('.sr').forEach(function(el){ obs.observe(el); });

// ─────────────────────────────────────────────────────
window.goBack = function(){
  if(document.referrer && document.referrer.indexOf('training_plan')>=0){
    history.back();
  } else {
    location.href='training_plan.html';
  }
};

})();
</script>
