<style>
:root{
  --bg:#0B0F1A;--surface:#131929;--surface2:#1A2235;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.05);
  --text:#E8ECF4;--muted:#94A3B8;--dim:#5A6A84;
  --orange:#FF6535;--cyan:#0EA5E9;--green:#10B981;--gold:#C8A22A;--purple:#A855F7;
  --ease:200ms cubic-bezier(.4,0,.2,1);
  --radius:10px;
  /* Sport colors */
  --swim:#06B6D4;--bike:#F97316;--run:#22C55E;--str:#A855F7;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}

/* ── Layout ── */
.yr-wrap{max-width:960px;margin:0 auto;padding:2rem 1rem 4rem}
.yr-header{text-align:center;margin-bottom:3rem;padding:3rem 1rem 2rem}
.yr-logo{font-family:'Oswald',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:.2em;color:var(--orange);text-transform:uppercase;margin-bottom:1.5rem}
.yr-headline{font-family:'Barlow Condensed',sans-serif;font-size:clamp(2.5rem,7vw,5rem);font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.yr-headline span{color:var(--orange)}
.yr-sub{font-size:.95rem;color:var(--muted);margin-top:.75rem}
.yr-year-select{display:flex;gap:.5rem;justify-content:center;margin-top:1.5rem}
.yr-year-btn{font-family:'Oswald',sans-serif;font-size:.8rem;padding:.4rem .9rem;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all var(--ease)}
.yr-year-btn.on{background:var(--orange);border-color:var(--orange);color:#000;font-weight:700}

/* ── Stat grid ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:1.25rem 1rem;text-align:center;position:relative;overflow:hidden;transition:border-color var(--ease)}
.stat-card:hover{border-color:var(--orange)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--ac,var(--orange))}
.stat-num{font-family:'Oswald',sans-serif;font-size:2.2rem;font-weight:700;color:var(--text);line-height:1}
.stat-unit{font-size:.7rem;color:var(--muted);margin-left:.15rem}
.stat-label{font-size:.65rem;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-top:.4rem}

/* ── Sport breakdown ── */
.sport-row{display:flex;align-items:center;gap:.75rem;padding:.6rem 0;border-bottom:1px solid var(--border2)}
.sport-row:last-child{border:none}
.sport-icon{font-size:1.3rem;width:2rem;text-align:center;flex-shrink:0}
.sport-info{flex:1;min-width:0}
.sport-name{font-family:'Barlow Condensed',sans-serif;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.sport-bar-bg{height:6px;background:var(--border2);border-radius:3px;margin-top:.35rem;overflow:hidden}
.sport-bar-f{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.sport-stat{font-family:'Oswald',sans-serif;font-size:.9rem;color:var(--muted);flex-shrink:0;text-align:right;min-width:60px}

/* ── Monthly TSS chart ── */
.month-chart{display:flex;align-items:flex-end;gap:3px;height:80px;padding:0 .5rem}
.month-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.month-bar{width:100%;border-radius:2px 2px 0 0;transition:height .4s cubic-bezier(.4,0,.2,1);background:var(--orange);min-height:2px}
.month-label{font-size:.55rem;color:var(--dim);text-align:center;writing-mode:horizontal-tb}

/* ── Highlight cards ── */
.highlight-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.5rem}
.hl-card{background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);border:1px solid var(--border2);border-radius:var(--radius);padding:1.2rem;position:relative;overflow:hidden}
.hl-card::before{content:'';position:absolute;inset:0;border-radius:inherit;border:1px solid transparent;background:linear-gradient(135deg,var(--ac,var(--orange))22,transparent) border-box;-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:destination-out;mask-composite:exclude}
.hl-emoji{font-size:1.8rem;margin-bottom:.5rem;display:block}
.hl-title{font-size:.65rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.3rem}
.hl-val{font-family:'Oswald',sans-serif;font-size:1.35rem;font-weight:700;color:var(--text)}
.hl-sub{font-size:.68rem;color:var(--muted);margin-top:.25rem}

/* ── CTL evolution ── */
.ctl-row{display:flex;align-items:center;gap:1rem;justify-content:center;flex-wrap:wrap;padding:1rem}
.ctl-box{text-align:center;padding:.75rem 1.25rem;border-radius:8px;background:var(--surface2);border:1px solid var(--border2)}
.ctl-lbl{font-size:.62rem;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.3rem}
.ctl-num{font-family:'Oswald',sans-serif;font-size:1.6rem;font-weight:700}
.ctl-arrow{font-size:2rem;color:var(--muted)}

/* ── Share button ── */
.share-section{text-align:center;padding:2rem 0}
.share-btn{display:inline-flex;align-items:center;gap:.6rem;background:var(--orange);color:#000;border:none;border-radius:24px;padding:.75rem 2rem;font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:transform var(--ease),box-shadow var(--ease)}
.share-btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(255,101,53,.35)}

/* ── Panel ── */
.yr-panel{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:1.5rem}
.yr-panel-title{font-family:'Barlow Condensed',sans-serif;font-size:.88rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:1rem}

/* ── Loading / Empty ── */
.yr-loading{text-align:center;padding:4rem 1rem;color:var(--dim);font-size:.85rem}
.yr-spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Sidebar (reusa nav) ── */
.sb-layout{display:flex;min-height:100vh}
.main{flex:1;overflow:auto}

/* ── Responsive ── */
@media(max-width:640px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .highlight-grid{grid-template-columns:1fr 1fr}
}

/* ── Print share card ── */
@media print{
  body>*:not(#yr-share-card){display:none!important}
  #yr-share-card{display:block!important;position:static!important}
}
</style>

<div class="yr-wrap">

  <!-- Header -->
  <div class="yr-header">
    <div class="yr-logo" style="display:flex;align-items:center;gap:.5rem;font-size:.95rem"><svg class="sbl-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><radialGradient id="lxnl-glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FF6535" stop-opacity=".6"/><stop offset="100%" stop-color="#FF6535" stop-opacity="0"/></radialGradient></defs><g class="sbl-arcs"><circle cx="50" cy="50" r="44" stroke="#F0A500" stroke-width="1.5" stroke-dasharray="62 214" stroke-linecap="round" transform="rotate(28 50 50)" stroke-opacity=".7"/><circle cx="50" cy="50" r="40" stroke="#0EA5E9" stroke-width=".8" stroke-dasharray="23 231" stroke-linecap="round" transform="rotate(-90 50 50)" stroke-opacity=".6"/></g><g class="sbl-flower"><circle cx="50" cy="50" r="13" stroke="rgba(255,101,53,.28)" stroke-width=".8" fill="rgba(255,101,53,.05)"/><circle cx="63" cy="50" r="13" stroke="rgba(255,101,53,.2)" stroke-width=".6" fill="rgba(255,101,53,.03)"/><circle cx="56.5" cy="38.8" r="13" stroke="rgba(240,165,0,.2)" stroke-width=".6" fill="rgba(240,165,0,.03)"/><circle cx="43.5" cy="38.8" r="13" stroke="rgba(14,165,233,.2)" stroke-width=".6" fill="rgba(14,165,233,.03)"/><circle cx="37" cy="50" r="13" stroke="rgba(255,101,53,.2)" stroke-width=".6" fill="rgba(255,101,53,.03)"/><circle cx="43.5" cy="61.2" r="13" stroke="rgba(240,165,0,.2)" stroke-width=".6" fill="rgba(240,165,0,.03)"/><circle cx="56.5" cy="61.2" r="13" stroke="rgba(14,165,233,.2)" stroke-width=".6" fill="rgba(14,165,233,.03)"/></g><circle cx="50" cy="50" r="9.5" fill="url(#lxnl-glow)"/><circle cx="50" cy="50" r="6" fill="rgba(255,101,53,.12)" stroke="rgba(255,101,53,.35)" stroke-width=".8"/><text x="50" y="55.5" text-anchor="middle" font-size="7.5" font-family="serif" style="filter:drop-shadow(0 0 3px rgba(255,101,53,.8))">&#x1F33A;</text></svg> <a href="landing.html" style="text-decoration:none;color:var(--orange);font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.2em">LabX</a></div>
    <div class="yr-headline">Tu a&#241;o en<br><span id="yr-headline-year">2025</span></div>
    <div class="yr-sub" id="yr-sub">Cargando tu resumen anual&#8230;</div>
    <div class="yr-year-select" id="yr-year-btns"></div>

  <!-- Loading state -->
  <div id="yr-loading" class="yr-loading">

    Construyendo tu resumen&#8230;

  <!-- Content (hidden until loaded) -->
  <div id="yr-content" style="display:none">

    <!-- Totales -->

    <!-- Panel: por deporte -->

</div><!-- /yr-wrap -->

<!-- Share card (shown on print / share) -->
<div id="yr-share-card" style="display:none;position:fixed;inset:0;background:linear-gradient(135deg,#0B0F1A 0%,#1A1035 50%,#0B1A24 100%);z-index:9999;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem">
  <div style="background:linear-gradient(135deg,#131929,#1A2235);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:2rem;max-width:400px;width:100%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.6)">

    <div style="font-family:'Barlow Condensed',sans-serif;font-size:1.3rem;font-weight:900;text-transform:uppercase;margin-bottom:.3rem" id="sc-athlete"></div>

<script>
(function(){
  var API = window.location.protocol==='file:' ? 'http://localhost:8000/api' : window.location.origin+'/api';
  var TOK = function(){ return localStorage.getItem('lx_token') || localStorage.getItem('lx_co_token') || ''; };
  var HDR = function(){ return {Authorization:'Bearer '+TOK()}; };

  var _data = null;
  var _year = new Date().getFullYear() - 1;   // mostrar año anterior por defecto

  var SPORT_LABEL = {swim:'Natación', bike:'Ciclismo', run:'Carrera', strength:'Fuerza', gym:'Gimnasio', brick:'Brick', other:'Otro'};
  var SPORT_COLOR = {swim:'var(--swim)', bike:'var(--bike)', run:'var(--run)', strength:'var(--str)', gym:'var(--str)'};
  var SPORT_ICON  = {swim:'🏊', bike:'🚴', run:'🏃', strength:'💪', gym:'💪', brick:'⚡', other:'🏅'};

  function _g(id){ return document.getElementById(id); }
  function _esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function _fmt_hm(h){ var hh=Math.floor(h); var m=Math.round((h-hh)*60); return hh+'h'+(m>0?' '+m+'m':''); }

  /* ── Year selector ────────────────────────────────────────────────────── */
  function _buildYearBtns(){
    var cy = new Date().getFullYear();
    var btns = _g('yr-year-btns');
    btns.innerHTML = '';
    for(var y = cy; y >= cy-3; y--){
      var b = document.createElement('button');
      b.className = 'yr-year-btn' + (y===_year?' on':'');
      b.textContent = y;
      b.setAttribute('data-y', y);
      b.onclick = function(){ _year = parseInt(this.getAttribute('data-y')); _buildYearBtns(); loadData(); };
      btns.appendChild(b);
    }
  }

  /* ── Data load ────────────────────────────────────────────────────────── */
  function loadData(){
    _g('yr-loading').style.display = '';
    _g('yr-content').style.display = 'none';
    _g('yr-empty').style.display   = 'none';
    _g('yr-headline-year').textContent = _year;

    fetch(API+'/athlete/year-in-review?year='+_year, {headers:HDR()})
      .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function(d){
        _data = d;
        _g('yr-loading').style.display = 'none';
        if(!d.total_activities){
          _g('yr-empty').style.display = '';
          return;
        }
        _g('yr-sub').textContent = 'Un año increíble, '+( d.athlete_name.split(' ')[0] )+'';
        _g('yr-content').style.display = '';
        _renderStats(d);
        _renderSports(d);
        _renderMonths(d);
        _renderHighlights(d);
        _renderCtl(d);
      })
      .catch(function(e){
        _g('yr-loading').style.display = 'none';
        _g('yr-empty').style.display = '';
        console.error('YIR error', e);
      });
  }

  /* ── Stat grid ────────────────────────────────────────────────────────── */
  function _renderStats(d){
    var grid = _g('yr-stat-grid');
    var items = [
      {num: d.total_activities, unit:'actividades', label:'Total actividades', ac:'var(--orange)'},
      {num: d.total_hours+'h',  unit:'',            label:'Horas entrenadas',  ac:'var(--cyan)'},
      {num: d.total_km+'km',    unit:'',            label:'Kilómetros totales', ac:'var(--green)'},
      {num: Math.round(d.total_tss), unit:'TSS',   label:'Carga total',        ac:'var(--purple)'},
    ];
    grid.innerHTML = items.map(function(i){
      return '<div class="stat-card" style="--ac:'+i.ac+'">'
        +'<div class="stat-num">'+i.num+'<span class="stat-unit">'+i.unit+'</span></div>'
        +'<div class="stat-label">'+i.label+'</div>'
        +'</div>';
    }).join('');
  }

  /* ── Sport breakdown ──────────────────────────────────────────────────── */
  function _renderSports(d){
    var container = _g('yr-sport-breakdown');
    var sports = Object.entries(d.by_sport).sort(function(a,b){ return b[1].km - a[1].km; });
    var maxKm   = sports.reduce(function(m,s){ return Math.max(m, s[1].km); }, 0);
    container.innerHTML = sports.map(function(entry){
      var sport = entry[0], info = entry[1];
      var clr   = SPORT_COLOR[sport] || 'var(--orange)';
      var pct   = maxKm > 0 ? Math.round(info.km / maxKm * 100) : 0;
      return '<div class="sport-row">'
        +'<div class="sport-icon">'+( SPORT_ICON[sport]||'🏅' )+'</div>'
        +'<div class="sport-info">'
        +'<div class="sport-name">'+(SPORT_LABEL[sport]||sport)+'</div>'
        +'<div class="sport-bar-bg"><div class="sport-bar-f" style="width:'+pct+'%;background:'+clr+'"></div></div>'
        +'</div>'
        +'<div class="sport-stat">'+info.km+' km</div>'
        +'</div>';
    }).join('');
  }

  /* ── Monthly chart ────────────────────────────────────────────────────── */
  function _renderMonths(d){
    var chart  = _g('yr-month-chart');
    var months = d.month_series;
    var maxTss = months.reduce(function(m,mo){ return Math.max(m, mo.tss); }, 0);
    chart.innerHTML = months.map(function(mo){
      var pct = maxTss > 0 ? Math.max(2, Math.round(mo.tss / maxTss * 100)) : 2;
      var clr = mo.tss === maxTss ? 'var(--orange)' : 'rgba(255,101,53,.45)';
      return '<div class="month-bar-wrap" title="'+mo.label+': '+mo.tss+' TSS">'
        +'<div class="month-bar" style="height:'+pct+'%;background:'+clr+'"></div>'
        +'<div class="month-label">'+mo.label.slice(0,1)+'</div>'
        +'</div>';
    }).join('');
  }

  /* ── Highlights ───────────────────────────────────────────────────────── */
  function _renderHighlights(d){
    var hl   = _g('yr-highlights');
    var cards = [];

    // Peak week
    if(d.peak_week_iso){
      cards.push({emoji:'🔥', title:'Semana más dura', val:Math.round(d.peak_week_tss)+' TSS', sub:d.peak_week_iso, ac:'var(--orange)'});
    }

    // Favourite weekday
    if(d.fav_weekday){
      cards.push({emoji:'📅', title:'Día favorito', val:d.fav_weekday, sub:'El día que más entrenas', ac:'var(--cyan)'});
    }

    // Longest by sport
    Object.entries(d.longest_by_sport).forEach(function(entry){
      var sport = entry[0], act = entry[1];
      if(!act.dist_km) return;
      cards.push({
        emoji: SPORT_ICON[sport]||'🏅',
        title: 'Mejor '+( SPORT_LABEL[sport]||sport ).toLowerCase(),
        val:   act.dist_km+' km',
        sub:   (act.dur_min ? _fmt_hm(act.dur_min/60)+' · ' : '') + (act.date_iso||'').slice(0,10),
        ac:    SPORT_COLOR[sport]||'var(--orange)',
      });
    });

    // CTL improvement
    if(d.ctl_improvement !== null && d.ctl_improvement !== undefined){
      var sign = d.ctl_improvement > 0 ? '+' : '';
      cards.push({emoji:'📈', title:'Mejora de fitness', val:sign+d.ctl_improvement+' CTL', sub:'Inicio → fin de año', ac:'var(--green)'});
    }

    hl.innerHTML = cards.slice(0,6).map(function(c){
      return '<div class="hl-card" style="--ac:'+c.ac+'">'
        +'<span class="hl-emoji">'+c.emoji+'</span>'
        +'<div class="hl-title">'+_esc(c.title)+'</div>'
        +'<div class="hl-val">'+_esc(c.val)+'</div>'
        +'<div class="hl-sub">'+_esc(c.sub)+'</div>'
        +'</div>';
    }).join('');
  }

  /* ── CTL ──────────────────────────────────────────────────────────────── */
  function _renderCtl(d){
    var row = _g('yr-ctl-row');
    if(!d.ctl_start && !d.ctl_end){ row.innerHTML = '<div style="color:var(--dim);font-size:.8rem">Sin datos de CTL</div>'; return; }

    var color = (d.ctl_improvement||0) >= 0 ? 'var(--green)' : 'var(--orange)';
    var arrow = (d.ctl_improvement||0) >= 0 ? '↑' : '↓';
    var sign  = (d.ctl_improvement||0) > 0 ? '+' : '';

    row.innerHTML = ''
      +'<div class="ctl-box"><div class="ctl-lbl">Inicio del año</div><div class="ctl-num" style="color:var(--muted)">'+(d.ctl_start||'—')+'</div></div>'
      +'<div class="ctl-arrow">'+arrow+'</div>'
      +'<div class="ctl-box" style="border-color:'+color+'44"><div class="ctl-lbl">Fin del año</div><div class="ctl-num" style="color:'+color+'">'+(d.ctl_end||'—')+'</div></div>'
      +(d.ctl_peak ? '<div class="ctl-box"><div class="ctl-lbl">Pico del año</div><div class="ctl-num" style="color:var(--gold)">'+d.ctl_peak.value+'</div><div style="font-size:.6rem;color:var(--dim);margin-top:.2rem">'+d.ctl_peak.date_iso.slice(5)+'</div></div>' : '')
      +(d.ctl_improvement !== null ? '<div style="text-align:center"><div style="font-size:.65rem;color:var(--dim);margin-bottom:.3rem">Mejora total</div><div style="font-family:Oswald,sans-serif;font-size:1.6rem;font-weight:700;color:'+color+'">'+sign+d.ctl_improvement+'</div></div>' : '');
  }

  /* ── Share card ───────────────────────────────────────────────────────── */
  window.shareYearCard = function(){
    if(!_data) return;
    var card = _g('yr-share-card');
    card.style.display = 'flex';
    document.body.style.overflow = 'hidden';

    _g('sc-athlete').textContent = _data.athlete_name;
    _g('sc-year').textContent    = _year;

    var stats = [
      {n:_data.total_activities,  u:'actividades'},
      {n:_data.total_km+'km',     u:'totales'},
      {n:Math.round(_data.total_hours)+'h', u:'entrenadas'},
    ];
    _g('sc-stats').innerHTML = stats.map(function(s){
      return '<div style="background:rgba(255,255,255,.05);border-radius:8px;padding:.7rem .5rem">'
        +'<div style="font-family:Oswald,sans-serif;font-size:1.5rem;font-weight:700;color:var(--orange)">'+s.n+'</div>'
        +'<div style="font-size:.6rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em">'+s.u+'</div>'
        +'</div>';
    }).join('');
  };

  window.downloadShareCard = function(){
    window.print();
  };

  window.closeShareCard = function(){
    var card = _g('yr-share-card');
    card.style.display = 'none';
    document.body.style.overflow = '';
  };

  document.addEventListener('keydown', function(e){ if(e.key==='Escape') window.closeShareCard(); });

  /* ── Init ─────────────────────────────────────────────────────────────── */
  _buildYearBtns();
  loadData();

})();
</script>

<script src="auth.js"></script>
<script>KL.guard('year_in_review');</script>
<script src="nav.js"></script>
<script src="i18n.js"></script>
</body>
</html>
