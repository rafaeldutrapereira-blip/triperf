# LabX — Nginx production config
# S17: Cloudflare CDN + SSL + rate limiting + SSE support
#
# Prerequisitos:
#   certbot certonly --nginx -d labx.app -d www.labx.app
#   pip install uvicorn gunicorn
#   systemd service: labx-api.service

# Rate limit zones
limit_req_zone $binary_remote_addr zone=api_auth:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=static:10m      rate=200r/m;

# Connection limit (anti-DDoS básico)
limit_conn_zone $binary_remote_addr zone=perip:10m;

# ── Real IPs desde Cloudflare ──────────────────────────────────
# Actualizar cuando Cloudflare publique nuevos rangos: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
real_ip_header CF-Connecting-IP;

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name labx.app www.labx.app;
    return 301 https://labx.app$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.labx.app;
    ssl_certificate     /etc/letsencrypt/live/labx.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labx.app/privkey.pem;
    return 301 https://labx.app$request_uri;
}

server {
    listen 443 ssl http2;
    server_name labx.app;

    # SSL — Certbot managed
    ssl_certificate     /etc/letsencrypt/live/labx.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labx.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Ocultar versión de Nginx
    server_tokens off;

    # Conexiones máximas por IP
    limit_conn perip 20;

    root /var/www/labx;
    index login.html;
    client_max_body_size 2M;

    # ── Static files — Cloudflare cacheará estos ──────────────────
    location ~* \.(js|css|png|ico|svg|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        limit_req zone=static burst=50 nodelay;
    }

    # ── Manifest + SW — corta cache para actualizaciones ──────────
    location ~ ^/(manifest\.json|sw\.js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── SSE — no buffering, conexión larga ────────────────────────
    location /api/events {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;   # mantener SSE abierto 1 hora
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── API auth endpoints — rate limit estricto ──────────────────
    location ~ ^/api(/v1)?/auth/(login|register|forgot-password) {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Stripe webhook — sin rate limit, con tamaño permitido ─────
    location ~ ^/api(/v1)?/stripe/webhook {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   stripe-signature $http_stripe_signature;
        client_max_body_size 1M;
        proxy_read_timeout 30s;
    }

    # ── API general ───────────────────────────────────────────────
    location /api {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Health check — sin rate limit (para balanceadores) ────────
    location /health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # ── SPA fallback ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /login.html;
    }

    # ── Bloquear acceso a archivos sensibles ──────────────────────
    location ~ /\.(env|git|htpasswd) {
        deny all;
        return 404;
    }
    location ~ \.(py|db|sqlite)$ {
        deny all;
        return 404;
    }

    # Logs en formato JSON para análisis
    access_log /var/log/nginx/labx_access.log combined;
    error_log  /var/log/nginx/labx_error.log warn;
}
