<html lang="es">
<head>

<title>LabX — Comunidad</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04080F;--surface:#08121E;--surface2:#0C1D30;--surface3:#0F2540;
  --border:rgba(8,116,174,.18);--border2:rgba(8,116,174,.10);
  --orange:#FF6535;--gold:#F0A500;--coral:#FF8C61;
  --cyan:#0EA5E9;--aqua:#22D3EE;--green:#10B981;--red:#EF4444;
  --purple:#A855F7;--amber:#F59E0B;--pink:#EC4899;
  --text:#F0F9FF;--muted:#7FB3CC;--dim:#3D6880;
  --radius:12px;--ease:220ms cubic-bezier(.4,0,.2,1);
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}ul{list-style:none}
.c{max-width:1280px;margin:0 auto;padding:0 clamp(1.25rem,4vw,2.5rem)}
.btn{display:inline-flex;align-items:center;gap:.45rem;font-family:'Oswald',sans-serif;font-size:.8rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:.65rem 1.4rem;border-radius:6px;border:none;cursor:pointer;transition:all var(--ease)}
.btn-g{background:transparent;color:var(--muted);border:1.5px solid var(--border)}.btn-g:hover{border-color:var(--cyan);color:var(--cyan)}
.btn-sm{padding:.38rem .9rem;font-size:.72rem}
.btn-primary{background:var(--purple);color:#fff}.btn-primary:hover{opacity:.88}
.btn-orange{background:var(--orange);color:#fff}.btn-orange:hover{opacity:.88}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.panel-head{padding:.9rem 1.2rem;border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.panel-title{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:.45rem}
.sr{opacity:0;transform:translateY(18px);transition:opacity .45s var(--ease),transform .45s var(--ease)}.vis{opacity:1;transform:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:.75rem}
@media(max-width:900px){.g5{grid-template-columns:repeat(3,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.g5,.g3,.g2{grid-template-columns:1fr}}
.mt2{margin-top:1.5rem}.mt1{margin-top:1rem}

/* ── PAGE HEADER ── */
.ph{padding-top:1.5rem;background:linear-gradient(180deg,#060E1C 0%,var(--bg) 100%);border-bottom:1px solid var(--border2)}
.ph-inner{padding:1.5rem 0 1.2rem;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.ph-title{font-family:'Barlow Condensed',sans-serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:900;letter-spacing:-.01em;text-transform:uppercase;line-height:1}
.ph-sub{font-family:'Oswald',sans-serif;font-size:.72rem;color:var(--muted);letter-spacing:.08em;margin-top:.3rem}

/* ── TABS ── */
.tabs-bar{display:flex;gap:3px;background:var(--surface2);border-radius:8px;padding:3px;flex-wrap:wrap;margin-bottom:1.5rem}
.tab-btn{background:none;border:none;cursor:pointer;font-family:'Oswald',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.38rem .95rem;border-radius:5px;color:var(--dim);transition:all var(--ease);white-space:nowrap}
.tab-btn.on{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.tab-pane{display:none}.tab-pane.on{display:block}

/* ── STAT CHIPS ── */
.stat-chip{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.7rem 1rem;text-align:center}
.stat-n{font-family:'Barlow Condensed',sans-serif;font-size:1.6rem;font-weight:900;line-height:1}
.stat-l{font-family:'Oswald',sans-serif;font-size:.55rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:.15rem}

/* ── ACTIVITY CARD ── */
.activity-card{background:var(--surface);border:1px solid var(--border2);border-radius:10px;margin-bottom:.75rem;overflow:hidden;transition:border-color .2s}
.activity-card:hover{border-color:var(--border)}
.ac-head{padding:.75rem 1rem;display:flex;align-items:center;gap:.75rem}
.ac-avatar{width:34px;height:34px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:.95rem;font-weight:800;color:var(--cyan);flex-shrink:0}
.ac-user{flex:1;min-width:0}
.ac-name{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-meta{font-family:'Oswald',sans-serif;font-size:.6rem;color:var(--dim);letter-spacing:.06em}
.ac-sport{font-size:1.1rem}
.ac-body{padding:.5rem 1rem .75rem}
.ac-title{font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;font-weight:800;margin-bottom:.4rem}
.ac-caption{font-size:.85rem;color:var(--muted);line-height:1.5;margin-bottom:.6rem;white-space:pre-wrap}
.ac-row{display:flex;align-items:flex-start;gap:.75rem}
.ac-row.clickable{cursor:pointer;border-radius:8px;margin:-.3rem;padding:.3rem;transition:background .15s}
.ac-row.clickable:hover{background:var(--surface2)}
.ac-row.clickable:hover .ac-title{color:var(--cyan)}
.ac-info{flex:1;min-width:0}
.ac-map{width:74px;height:74px;flex-shrink:0;border-radius:8px;background:var(--surface2);border:1px solid var(--border);overflow:hidden}
.ac-map svg{width:100%;height:100%;display:block}
.ac-stats{display:flex;gap:1.2rem;flex-wrap:wrap;margin-bottom:.5rem}
.ac-stat{font-size:.72rem;color:var(--muted)}
.ac-stat strong{font-family:'Barlow Condensed',sans-serif;font-size:.95rem;font-weight:800;color:var(--text)}
.rec-chip{display:inline-flex;align-items:center;gap:.3rem;font-family:'Oswald',sans-serif;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.2rem .5rem;border-radius:4px;margin-bottom:.4rem}
.tsb-chip{font-family:'Barlow Condensed',sans-serif;font-size:.75rem;font-weight:800;padding:.1rem .4rem;border-radius:3px;margin-left:.35rem}
.ac-foot{padding:.45rem 1rem;border-top:1px solid var(--border2);display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.kudo-btn{background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:.3rem;font-family:'Oswald',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.08em;color:var(--dim);padding:.25rem .5rem;border-radius:5px;transition:all .15s}
.kudo-btn:hover,.kudo-btn.on{color:var(--orange)}
.kudo-btn.on svg{fill:var(--orange)}
.comment-toggle{background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:.3rem;font-family:'Oswald',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.08em;color:var(--dim);padding:.25rem .5rem;border-radius:5px;transition:color .15s}
.comment-toggle:hover{color:var(--cyan)}
.comment-section{padding:.5rem 1rem .75rem;border-top:1px solid var(--border2);display:none}
.comment-section.open{display:block}
.comment-item{display:grid;grid-template-columns:28px 1fr;gap:.5rem;margin-bottom:.5rem;align-items:start}
.comment-av{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:.75rem;font-weight:800;color:var(--muted);flex-shrink:0}
.comment-body{background:var(--surface2);border-radius:6px;padding:.35rem .6rem;font-size:.76rem}
.comment-author{font-family:'Oswald',sans-serif;font-size:.6rem;font-weight:700;letter-spacing:.06em;color:var(--cyan);margin-bottom:.1rem}
.comment-input-row{display:flex;gap:.5rem;margin-top:.5rem}
.comment-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.4rem .7rem;color:var(--text);font-size:.78rem;font-family:'Inter',sans-serif}
.comment-input:focus{outline:none;border-color:var(--cyan)}
.comment-submit{font-family:'Oswald',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.08em;padding:.4rem .8rem;border-radius:5px;background:var(--cyan);color:#000;border:none;cursor:pointer}

/* ── POST FORM ── */
.post-form{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:1.25rem}
.post-select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.45rem .7rem;color:var(--muted);font-size:.78rem;font-family:'Inter',sans-serif;width:100%}
.post-select:focus{outline:none;border-color:var(--cyan)}
.post-caption{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.5rem .7rem;color:var(--text);font-size:.8rem;font-family:'Inter',sans-serif;width:100%;resize:none;height:60px;margin:.5rem 0}
.post-caption:focus{outline:none;border-color:var(--cyan)}
.post-row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.vis-select{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:.35rem .6rem;color:var(--muted);font-size:.72rem;font-family:'Oswald',sans-serif;flex-shrink:0}

/* ── LEADERBOARD ── */
.lb-row{display:grid;grid-template-columns:36px 36px 1fr 90px 60px;gap:.6rem;align-items:center;padding:.5rem .75rem;border-bottom:1px solid var(--border2);font-size:.78rem;transition:background .15s}
.lb-row:hover{background:var(--surface2)}
.lb-row:last-child{border-bottom:none}
.lb-rank{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:900;text-align:center}
.lb-av{width:32px;height:32px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:.82rem;font-weight:800;color:var(--cyan)}
.lb-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.lb-flag{font-size:.85rem}
.lb-value{font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;font-weight:900;text-align:right;color:var(--cyan)}
.lb-acts{font-size:.62rem;color:var(--dim);text-align:right}
.lb-me{background:rgba(168,85,247,.06);border-left:3px solid var(--purple)}

/* ── CLUB CARD ── */
.club-card{background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:.9rem 1rem;cursor:pointer;transition:border-color .2s}
.club-card:hover{border-color:var(--border)}
.club-avatar{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:1.2rem;font-weight:900;color:#fff;margin-bottom:.5rem}
.club-name{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:800;margin-bottom:.15rem}
.club-meta{font-family:'Oswald',sans-serif;font-size:.6rem;letter-spacing:.08em;color:var(--dim);margin-bottom:.5rem}
.club-badge{display:inline-block;font-family:'Oswald',sans-serif;font-size:.55rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.15rem .4rem;border-radius:3px;background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.3)}

/* ── CHALLENGE CARD ── */
.ch-card{background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:.9rem 1rem}
.ch-title{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:800;margin-bottom:.25rem}
.ch-meta{font-family:'Oswald',sans-serif;font-size:.6rem;letter-spacing:.08em;color:var(--dim);margin-bottom:.5rem}
.ch-prog-bar{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin:.4rem 0}
.ch-prog-fill{height:100%;border-radius:3px;background:var(--purple);transition:width .6s}
.ch-pct{font-family:'Barlow Condensed',sans-serif;font-size:.85rem;font-weight:800;color:var(--purple)}

/* ── PROFILE CARD ── */
.profile-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem;display:flex;align-items:flex-start;gap:.75rem}
.prof-av{width:48px;height:48px;border-radius:50%;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:900;color:var(--cyan);flex-shrink:0}
.prof-name{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:800}
.prof-meta{font-family:'Oswald',sans-serif;font-size:.62rem;color:var(--dim);letter-spacing:.06em}
.follow-btn{font-family:'Oswald',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.28rem .7rem;border-radius:5px;border:1.5px solid var(--cyan);background:transparent;color:var(--cyan);cursor:pointer;transition:all .15s;flex-shrink:0}
.follow-btn:hover,.follow-btn.following{background:var(--cyan);color:#000}

/* ── SEARCH BAR ── */
.search-bar{display:flex;gap:.5rem;margin-bottom:1.25rem}
.search-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.6rem 1rem;color:var(--text);font-size:.85rem;font-family:'Inter',sans-serif}
.search-input:focus{outline:none;border-color:var(--cyan)}
.search-submit{font-family:'Oswald',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.1em;padding:.6rem 1.2rem;border-radius:8px;background:var(--cyan);color:#000;border:none;cursor:pointer}

/* ── ALERT ── */
.alert-chip{display:flex;align-items:flex-start;gap:.5rem;padding:.6rem .9rem;border-radius:7px;font-size:.76rem;line-height:1.5;margin-bottom:.5rem}
.alert-chip.info{background:rgba(14,165,233,.06);border:1px solid rgba(14,165,233,.2);color:var(--muted)}
.alert-chip.good{background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.25);color:var(--green)}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--dim)}
.empty-icon{font-size:2.5rem;margin-bottom:.6rem}
.empty-msg{font-size:.82rem;line-height:1.6}

footer{border-top:1px solid var(--border2);padding:1.25rem 0;text-align:center;margin-top:3rem}
footer div{font-family:'Oswald',sans-serif;font-size:.68rem;color:var(--dim);letter-spacing:.1em}

.lb-controls{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.lb-sel{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.35rem .65rem;color:var(--muted);font-size:.72rem;font-family:'Oswald',sans-serif}
</style>
<link rel="stylesheet" href="nav.css">
</head>
<body>

<!-- SIDEBAR -->
<aside id="sidebar"></aside>
<header class="sb-topbar"></header>
<div class="sb-overlay" id="sb-overlay"></div>

<!-- PAGE HEADER -->
<div class="ph">
  <div class="c">
    <div class="ph-inner">
      <div></div>
      <div id="community-stat-chips" class="g5" style="gap:.6rem"></div>
    </div>
  </div>
</div>

<div style="padding:1.75rem 0 5rem">
<div class="c">

<!-- ══ TABS ══ -->
<div class="tabs-bar sr" id="tabs-bar">
  <button class="tab-btn on"  onclick="switchTab('feed',this)">🏃 Feed</button>
  <button class="tab-btn"     onclick="switchTab('discover',this)">🔍 Descubrir</button>
  <button class="tab-btn"     onclick="switchTab('clubs',this)">🏆 Clubs</button>
  <button class="tab-btn"     onclick="switchTab('challenges',this)">⚡ Desafíos</button>
  <button class="tab-btn"     onclick="switchTab('profile',this)">👤 Mi Perfil</button>
</div>

<!-- ══ TAB: FEED ══ -->
<div class="tab-pane on" id="tab-feed">
  <!-- Post form -->
  <div class="post-form sr" id="post-form-wrap">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:.9rem;font-weight:800;margin-bottom:.6rem;color:var(--muted)">COMPARTIR ACTIVIDAD</div>
    <select class="post-select" id="post-activity-sel">
      <option value="">— Selecciona una actividad Garmin —</option>
    </select>
    <textarea class="post-caption" id="post-caption" placeholder="¿Cómo fue? (opcional, máx. 280 caracteres)"></textarea>
    <div class="post-row">
      <select class="vis-select" id="post-visibility">
        <option value="followers">👥 Mis seguidos</option>
        <option value="public">🌍 Público</option>
        <option value="private">🔒 Solo yo</option>
      </select>
      <button class="btn btn-orange btn-sm" onclick="submitPost()">📤 Publicar</button>
    </div>
  </div>
  <!-- Feed -->
  <div id="feed-container"></div>
  <div style="text-align:center;margin-top:1rem">
    <button class="btn btn-g btn-sm" id="load-more-btn" onclick="loadMoreFeed()" style="display:none">Cargar más</button>
  </div>
</div>

<!-- ══ TAB: DESCUBRIR ══ -->
<div class="tab-pane" id="tab-discover">
  <div class="search-bar sr">
    <input class="search-input" id="search-input" type="text" placeholder="Buscar atletas por nombre o email…" onkeydown="if(event.key==='Enter')doSearch()">
    <button class="search-submit" onclick="doSearch()">Buscar</button>
  </div>
  <div id="search-results"></div>

  <!-- Leaderboard -->
  <div class="panel sr mt2" id="leaderboard-panel">
    <div class="panel-head">
      <span class="panel-title">🏅 Leaderboard LATAM</span>
      <div class="lb-controls">
        <select class="lb-sel" id="lb-scope" onchange="loadLeaderboard()">
          <option value="social">Mis seguidos</option>
          <option value="country">Mi país</option>
          <option value="global">Global</option>
        </select>
        <select class="lb-sel" id="lb-metric" onchange="loadLeaderboard()">
          <option value="tss">TSS</option>
          <option value="distance_km">Km</option>
          <option value="elevation_m">Elevación</option>
          <option value="duration_h">Horas</option>
        </select>
        <select class="lb-sel" id="lb-period" onchange="loadLeaderboard()">
          <option value="week">Esta semana</option>
          <option value="month">Este mes</option>
          <option value="year">Este año</option>
        </select>
      </div>
    </div>
    <div id="leaderboard-rows" style="padding:.25rem 0"></div>
  </div>

  <!-- Suggestions -->
  <div class="sr mt2" id="suggestions-section">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:.88rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem">ATLETAS SUGERIDOS</div>
    <div id="suggestions-grid" class="g2"></div>
  </div>
</div>

<!-- ══ TAB: CLUBS ══ -->
<div class="tab-pane" id="tab-clubs">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap;gap:.75rem">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:.88rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)">MIS CLUBS</div>
    <button class="btn btn-primary btn-sm" onclick="openCreateClub()">+ Crear club</button>
  </div>
  <div id="clubs-grid" class="g3"></div>
  <div style="font-family:'Barlow Condensed',sans-serif;font-size:.88rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:1.5rem 0 .75rem">DIRECTORIO</div>
  <div id="clubs-directory" class="g3"></div>
</div>

<!-- ══ TAB: DESAFÍOS ══ -->
<div class="tab-pane" id="tab-challenges">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap;gap:.75rem">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:.88rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)">DESAFÍOS ACTIVOS</div>
    <button class="btn btn-primary btn-sm" onclick="openCreateChallenge()">+ Crear desafío</button>
  </div>
  <div id="challenges-grid" class="g2"></div>
</div>

<!-- ══ TAB: MI PERFIL ══ -->
<div class="tab-pane" id="tab-profile">
  <div id="my-profile-content"></div>
</div>

</div>
</div>



<!-- CREATE CLUB MODAL -->
<div id="modal-club" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:flex;align-items:center;justify-content:center" onclick="if(event.target===this)closeModal('modal-club')">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.5rem;width:min(420px,90vw);max-height:90vh;overflow-y:auto">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:900;margin-bottom:1rem">CREAR CLUB</div>
    <input id="club-name" type="text" placeholder="Nombre del club*" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.5rem .75rem;color:var(--text);font-size:.82rem;margin-bottom:.5rem;font-family:'Inter',sans-serif">
    <textarea id="club-desc" placeholder="Descripción (opcional)" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.5rem .75rem;color:var(--text);font-size:.82rem;font-family:'Inter',sans-serif;height:60px;resize:none;margin-bottom:.5rem"></textarea>
    <div style="display:flex;gap:.5rem;margin-bottom:.75rem;flex-wrap:wrap">
      <select id="club-sport" style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.45rem .6rem;color:var(--muted);font-size:.75rem;font-family:'Oswald',sans-serif">
        <option value="triathlon">Triatlón</option><option value="running">Running</option>
        <option value="cycling">Ciclismo</option><option value="swimming">Natación</option><option value="all">Multi</option>
      </select>
      <select id="club-privacy" style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.45rem .6rem;color:var(--muted);font-size:.75rem;font-family:'Oswald',sans-serif">
        <option value="public">Público</option><option value="private">Privado</option>
      </select>
    </div>
    <div style="display:flex;gap:.5rem;justify-content:flex-end">
      <button class="btn btn-g btn-sm" onclick="closeModal('modal-club')">Cancelar</button>
      <button class="btn btn-primary btn-sm" onclick="submitCreateClub()">Crear</button>
    </div>
  </div>
</div>
<div id="modal-club" style="display:none"></div>

<div id="modal-challenge" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;align-items:center;justify-content:center" onclick="if(event.target===this)closeModal('modal-challenge')">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.5rem;width:min(420px,90vw);max-height:90vh;overflow-y:auto">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:900;margin-bottom:1rem">CREAR DESAFÍO</div>
    <input id="ch-title" type="text" placeholder="Título del desafío*" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.5rem .75rem;color:var(--text);font-size:.82rem;margin-bottom:.5rem;font-family:'Inter',sans-serif">
    <div style="display:flex;gap:.5rem;margin-bottom:.5rem;flex-wrap:wrap">
      <select id="ch-sport" style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.45rem .6rem;color:var(--muted);font-size:.75rem;font-family:'Oswald',sans-serif">
        <option value="all">Todos</option><option value="run">Running</option>
        <option value="bike">Ciclismo</option><option value="swim">Natación</option>
      </select>
      <select id="ch-metric" style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.45rem .6rem;color:var(--muted);font-size:.75rem;font-family:'Oswald',sans-serif">
        <option value="distance_km">Km</option><option value="tss">TSS</option>
        <option value="elevation_m">Elevación (m)</option><option value="duration_h">Horas</option>
      </select>
    </div>
    <input id="ch-goal" type="number" placeholder="Meta (ej: 100)" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.5rem .75rem;color:var(--text);font-size:.82rem;margin-bottom:.5rem;font-family:'Inter',sans-serif">
    <div style="display:flex;gap:.5rem;margin-bottom:.75rem">
      <input id="ch-start" type="date" style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.45rem .6rem;color:var(--muted);font-size:.75rem;font-family:'Oswald',sans-serif">
      <input id="ch-end" type="date" style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.45rem .6rem;color:var(--muted);font-size:.75rem;font-family:'Oswald',sans-serif">
    </div>
    <div style="display:flex;gap:.5rem;justify-content:flex-end">
      <button class="btn btn-g btn-sm" onclick="closeModal('modal-challenge')">Cancelar</button>
      <button class="btn btn-primary btn-sm" onclick="submitCreateChallenge()">Crear</button>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script src="nav.js" defer></script>
<script src="footer.js"></script>
<script src="dash-header.js"></script>
<script src="lx-upgrade.js"></script>
<script>
(function () {
  'use strict';

  var API  = '/api';
  // El JWT real vive en localStorage.lx_co_token — _k.token nunca existió
  // (kl_s no trae ese campo), así que todo fetch mandaba "Bearer " vacío.
  // Solo no rompía del todo porque fetch() manda la cookie same-origin por
  // default y el backend la prioriza — pero fallaba apenas esa cookie
  // expiraba (8h). Mismo patrón que mental.html/race_day.html esta sesión.
  function _authTok() {
    var direct = localStorage.getItem('lx_co_token');
    if (direct) return direct;
    try {
      var s = JSON.parse(sessionStorage.getItem('kl_s') || localStorage.getItem('kl_s') || 'null');
      return s && s.token ? s.token : '';
    } catch (e) { return ''; }
  }
  var hdrs = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + _authTok() };

  var _feedOffset = 0;
  var _feedLoading = false;

  // ── Scroll reveal ────────────────────────────────────────────────────────
  function reveal() {
    document.querySelectorAll('.sr').forEach(function (el) {
      if (el.getBoundingClientRect().top < window.innerHeight * 0.94) el.classList.add('vis');
    });
  }
  window.addEventListener('scroll', reveal, { passive: true });
  setTimeout(reveal, 80);

  // ── Tab switching ────────────────────────────────────────────────────────
  window.switchTab = function (id, btn) {
    document.querySelectorAll('.tab-pane').forEach(function (p) { p.classList.remove('on'); });
    document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('on'); });
    var pane = document.getElementById('tab-' + id);
    if (pane) pane.classList.add('on');
    if (btn) btn.classList.add('on');
    if (id === 'discover') { loadLeaderboard(); loadSuggestions(); }
    else if (id === 'clubs') loadClubs();
    else if (id === 'challenges') loadChallenges();
    else if (id === 'profile') loadMyProfile();
  };

  // ── Modal helpers ────────────────────────────────────────────────────────
  window.openCreateClub = function () {
    document.getElementById('modal-club').style.display = 'flex';
  };
  window.openCreateChallenge = function () {
    document.getElementById('modal-challenge').style.display = 'flex';
    var today = new Date().toISOString().slice(0, 10);
    document.getElementById('ch-start').value = today;
    var end = new Date(); end.setDate(end.getDate() + 30);
    document.getElementById('ch-end').value = end.toISOString().slice(0, 10);
  };
  window.closeModal = function (id) {
    document.getElementById(id).style.display = 'none';
  };

  // ── Community stats chips ────────────────────────────────────────────────
  function loadStats() {
    fetch(API + '/community/stats', { headers: hdrs })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var chips = [
          { label: 'Seguidores', value: d.follower_count,  color: 'var(--cyan)' },
          { label: 'Siguiendo',  value: d.following_count, color: 'var(--muted)' },
          { label: 'Kudos rec.', value: d.kudos_received,  color: 'var(--orange)' },
          { label: 'Clubs',      value: d.clubs_count,     color: 'var(--purple)' },
          { label: 'Posts',      value: d.posts_count,     color: 'var(--green)' },
        ];
        document.getElementById('community-stat-chips').innerHTML = chips.map(function (c) {
          return '<div class="stat-chip"><div class="stat-n" style="color:' + c.color + '">' + c.value + '</div><div class="stat-l">' + c.label + '</div></div>';
        }).join('');
      }).catch(function () {});
  }

  // ═════════════════════════════════════════════════════════════════════════
  // FEED
  // ═════════════════════════════════════════════════════════════════════════

  function loadRecentActivities() {
    fetch(API + '/athlete/activities?per_page=10', { headers: hdrs })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var acts = d.items || [];
        var sel = document.getElementById('post-activity-sel');
        acts.forEach(function (a) {
          var opt = document.createElement('option');
          opt.value = a.id;
          opt.textContent = (a.date_iso || '') + ' · ' + (a.sport || '') + ' · ' + (a.dist_km || 0) + 'km';
          sel.appendChild(opt);
        });
      }).catch(function () {});
  }

  function loadFeed(reset) {
    if (_feedLoading) return;
    if (reset) { _feedOffset = 0; document.getElementById('feed-container').innerHTML = ''; }
    _feedLoading = true;
    fetch(API + '/community/activity-feed?limit=10&offset=' + _feedOffset, { headers: hdrs })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var cards = d.feed || [];
        _feedOffset += cards.length;
        renderActivityCards(cards);
        var btn = document.getElementById('load-more-btn');
        if (btn) btn.style.display = d.has_more ? '' : 'none';
        _feedLoading = false;
        if (!cards.length && _feedOffset === 0) {
          document.getElementById('feed-container').innerHTML =
            '<div class="empty-state"><div class="empty-icon">🏃</div><div class="empty-msg">Tu feed está vacío.<br>Sigue a otros atletas para ver sus actividades aquí.</div></div>';
        }
      }).catch(function () { _feedLoading = false; });
  }

  window.loadMoreFeed = function () { loadFeed(false); };

  function _escCaption(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderMiniMap(points, color) {
    if (!points || points.length < 2) return '';
    var lats = points.map(function (p) { return p[0]; });
    var lons = points.map(function (p) { return p[1]; });
    var minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
    var minLon = Math.min.apply(null, lons), maxLon = Math.max.apply(null, lons);
    var W = 90, H = 90, pad = 6;
    var spanLat = (maxLat - minLat) || 0.0005;
    var spanLon = (maxLon - minLon) || 0.0005;
    // escala uniforme para no deformar el trazado, centrada en el viewBox
    var scale = Math.min((W - pad * 2) / spanLon, (H - pad * 2) / spanLat);
    var offX = (W - spanLon * scale) / 2;
    var offY = (H - spanLat * scale) / 2;
    var d = points.map(function (p, i) {
      var x = offX + (p[1] - minLon) * scale;
      var y = H - (offY + (p[0] - minLat) * scale); // invertir Y (lat sube, SVG y baja)
      return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
      '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="6" stroke-opacity=".18" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>';
  }

  function renderActivityCards(cards) {
    var el = document.getElementById('feed-container');
    cards.forEach(function (c) {
      var rec   = c.recovery || {};
      var tl    = c.training_load || {};
      var recColor = rec.color || '#3D6880';
      var tsbVal = tl.tsb !== null && tl.tsb !== undefined ? tl.tsb : null;
      var tsbCol = tsbVal !== null ? (tsbVal > 0 ? 'var(--green)' : tsbVal > -10 ? 'var(--amber)' : 'var(--red)') : 'var(--dim)';
      var tsbStr = tsbVal !== null ? (tsbVal > 0 ? '+' : '') + tsbVal : '';

      var recHtml = rec.score !== null && rec.score !== undefined
        ? '<div class="rec-chip" style="background:' + recColor + '22;color:' + recColor + ';border:1px solid ' + recColor + '55">' +
          rec.score + ' · ' + (rec.label || rec.level || '') +
          (tsbStr ? '<span class="tsb-chip" style="background:' + tsbCol + '22;color:' + tsbCol + '">TSB ' + tsbStr + '</span>' : '') +
          '</div>'
        : '';

      var mapColor = c.sport === 'run' ? '#10B981' : (c.sport === 'swim' ? '#0EA5E9' : '#FF6535');
      var mapHtml = c.route_preview && c.route_preview.length >= 2
        ? '<div class="ac-map">' + renderMiniMap(c.route_preview, mapColor) + '</div>'
        : '';

      var distStr = c.distance_km > 0 ? c.distance_km + ' km' : '';
      var durStr  = c.duration_min > 0 ? Math.floor(c.duration_min / 60) + 'h ' + Math.round(c.duration_min % 60) + 'm' : '';
      var tssStr  = c.tss ? 'TSS ' + c.tss : '';
      var hrStr   = c.avg_hr ? c.avg_hr + ' bpm' : '';
      var statParts = [distStr, durStr, tssStr, hrStr].filter(Boolean);

      var canOpen = c.is_viewer_activity && c.activity_id;
      var rowAttrs = canOpen
        ? ' class="ac-row clickable" onclick="location.href=\'training_detail.html?id=' + c.activity_id + '\'"'
        : ' class="ac-row"';

      var cardId = 'ac-' + c.id;
      var html = '<div class="activity-card" id="' + cardId + '">' +
        '<div class="ac-head">' +
          '<div class="ac-avatar">' + (c.user.avatar_initial || '?') + '</div>' +
          '<div class="ac-user">' +
            '<div class="ac-name">' + (c.user.country_flag ? c.user.country_flag + ' ' : '') + (c.user.name || '—') + '</div>' +
            '<div class="ac-meta">' + (c.date_iso || '') + '</div>' +
          '</div>' +
          '<div class="ac-sport">' + (c.sport_emoji || '⚡') + '</div>' +
        '</div>' +
        '<div class="ac-body">' +
          recHtml +
          '<div' + rowAttrs + '>' +
            '<div class="ac-info">' +
              '<div class="ac-title">' + (c.name || '') + '</div>' +
              (c.caption ? '<div class="ac-caption">' + _escCaption(c.caption) + '</div>' : '') +
              '<div class="ac-stats">' +
                statParts.map(function (s) { return '<span class="ac-stat"><strong>' + s + '</strong></span>'; }).join('') +
              '</div>' +
            '</div>' +
            mapHtml +
          '</div>' +
        '</div>' +
        '<div class="ac-foot">' +
          '<button class="kudo-btn' + (c.my_kudo ? ' on' : '') + '" id="kudo-btn-' + c.id + '" onclick="toggleKudo(\'' + c.id + '\')">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>' +
            '<span id="kudo-count-' + c.id + '">' + (c.kudo_count || 0) + '</span>' +
          '</button>' +
          '<button class="comment-toggle" onclick="toggleComments(\'' + c.id + '\')">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
            'Comentar' +
          '</button>' +
        '</div>' +
        '<div class="comment-section" id="comments-' + c.id + '">' +
          '<div id="comments-list-' + c.id + '"></div>' +
          '<div class="comment-input-row">' +
            '<input class="comment-input" id="comment-inp-' + c.id + '" placeholder="Escribe un comentario…" onkeydown="if(event.key===\'Enter\')submitComment(\'' + c.id + '\')">' +
            '<button class="comment-submit" onclick="submitComment(\'' + c.id + '\')">→</button>' +
          '</div>' +
        '</div>' +
        '</div>';
      el.insertAdjacentHTML('beforeend', html);
    });
  }

  var KUDO_TYPE = 'fire';

  window.toggleKudo = function (actId) {
    var btn = document.getElementById('kudo-btn-' + actId);
    var isOn = btn && btn.classList.contains('on');
    var method = isOn ? 'DELETE' : 'POST';
    var endpoint = API + '/community/posts/' + actId + '/kudo' + (isOn ? '?kudo_type=' + KUDO_TYPE : '');
    var opts = { method: method, headers: hdrs };
    if (!isOn) opts.body = JSON.stringify({ kudo_type: KUDO_TYPE });
    fetch(endpoint, opts)
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (d) {
        if (btn) {
          btn.classList.toggle('on', !isOn);
          var cnt = document.getElementById('kudo-count-' + actId);
          if (cnt && d.kudo_count !== undefined) cnt.textContent = d.kudo_count;
        }
      }).catch(function () {});
  };

  window.toggleComments = function (actId) {
    var sec = document.getElementById('comments-' + actId);
    if (!sec) return;
    var isOpen = sec.classList.contains('open');
    sec.classList.toggle('open', !isOpen);
    if (!isOpen) loadComments(actId);
  };

  function loadComments(actId) {
    fetch(API + '/community/posts/' + actId + '/comments', { headers: hdrs })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var list = document.getElementById('comments-list-' + actId);
        if (!list) return;
        var items = d.comments || d || [];
        list.innerHTML = items.map(function (c) {
          return '<div class="comment-item">' +
            '<div class="comment-av">' + ((c.author_name || c.user_name || '?')[0]).toUpperCase() + '</div>' +
            '<div class="comment-body">' +
              '<div class="comment-author">' + (c.author_name || c.user_name || '—') + '</div>' +
              (c.body || c.content || '') +
            '</div>' +
            '</div>';
        }).join('');
      }).catch(function () {});
  }

  window.submitComment = function (actId) {
    var inp = document.getElementById('comment-inp-' + actId);
    if (!inp || !inp.value.trim()) return;
    fetch(API + '/community/posts/' + actId + '/comments', {
      method: 'POST', headers: hdrs,
      body: JSON.stringify({ content: inp.value.trim() })
    }).then(function () {
      inp.value = '';
      loadComments(actId);
    }).catch(function () {});
  };

  window.submitPost = function () {
    var actId = document.getElementById('post-activity-sel').value;
    if (!actId) { alert('Selecciona una actividad'); return; }
    var caption    = document.getElementById('post-caption').value.slice(0, 280);
    var visibility = document.getElementById('post-visibility').value;
    fetch(API + '/community/posts', {
      method: 'POST', headers: hdrs,
      body: JSON.stringify({ activity_id: actId, body: caption, visibility: visibility })
    }).then(function () {
      document.getElementById('post-caption').value = '';
      document.getElementById('post-activity-sel').selectedIndex = 0;
      loadFeed(true);
    }).catch(function () {});
  };

  // ═════════════════════════════════════════════════════════════════════════
  // LEADERBOARD
  // ═════════════════════════════════════════════════════════════════════════

  window.loadLeaderboard = function () {
    var scope  = document.getElementById('lb-scope').value;
    var metric = document.getElementById('lb-metric').value;
    var period = document.getElementById('lb-period').value;
    var url = API + '/community/leaderboard?scope=' + scope + '&metric=' + metric + '&period=' + period + '&limit=25';
    fetch(url, { headers: hdrs })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var el = document.getElementById('leaderboard-rows');
        if (!el) return;
        var rows = d.leaderboard || [];
        if (!rows.length) {
          el.innerHTML = '<div class="empty-state" style="padding:1.5rem"><div class="empty-msg">Sigue atletas para ver el leaderboard de tu red.</div></div>';
          return;
        }
        var metricSuffix = { tss: '', distance_km: ' km', elevation_m: ' m', duration_h: 'h' };
        var suffix = metricSuffix[metric] || '';
        var medalColors = ['var(--gold)', '#C0C0C0', '#CD7F32'];

        el.innerHTML = rows.map(function (r) {
          var rankColor = r.rank <= 3 ? medalColors[r.rank - 1] : 'var(--dim)';
          var val = metric === 'duration_h' ? r.value.toFixed(1) : Math.round(r.value);
          return '<div class="lb-row' + (r.is_me ? ' lb-me' : '') + '">' +
            '<div class="lb-rank" style="color:' + rankColor + '">' + (r.rank <= 3 ? ['🥇','🥈','🥉'][r.rank-1] : r.rank) + '</div>' +
            '<div class="lb-av">' + (r.user.avatar_initial || '?') + '</div>' +
            '<div class="lb-name">' + (r.user.country_flag ? r.user.country_flag + ' ' : '') + r.user.name + (r.is_me ? ' <span style="font-size:.6rem;color:var(--purple);font-family:\'Oswald\',sans-serif;letter-spacing:.06em">(TÚ)</span>' : '') + '</div>' +
            '<div class="lb-value">' + val + suffix + '</div>' +
            '<div class="lb-acts">' + r.activity_count + ' acts</div>' +
            '</div>';
        }).join('');
      }).catch(function () {});
  };

  // ═════════════════════════════════════════════════════════════════════════
  // SUGGESTIONS + SEARCH
  // ═════════════════════════════════════════════════════════════════════════

  function loadSuggestions() {
    fetch(API + '/community/suggestions', { headers: hdrs })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var users = d.suggestions || d.users || [];
        var el = document.getElementById('suggestions-grid');
        if (!el) return;
        if (!users.length) { el.innerHTML = '<div style="color:var(--dim);font-size:.78rem">Ya sigues a todos los atletas sugeridos.</div>'; return; }
        el.innerHTML = users.slice(0, 6).map(function (u) { return profileCardHtml(u); }).join('');
      }).catch(function () {});
  }

  window.doSearch = function () {
    var q = (document.getElementById('search-input').value || '').trim();
    if (q.length < 2) return;
    fetch(API + '/community/search?q=' + encodeURIComponent(q), { headers: hdrs })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var el = document.getElementById('search-results');
        var users = d.results || [];
        if (!users.length) {
          el.innerHTML = '<div class="alert-chip info">Sin resultados para "' + q + '".</div>';
          return;
        }
        el.innerHTML = '<div class="g2" style="margin-bottom:1rem">' + users.map(profileCardHtml).join('') + '</div>';
      }).catch(function () {});
  };

  function profileCardHtml(u) {
    var ctlStr = u.ctl ? ' · CTL ' + u.ctl : '';
    return '<div class="profile-card">' +
      '<div class="prof-av">' + (u.avatar_initial || '?') + '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="prof-name">' + (u.country_flag ? u.country_flag + ' ' : '') + (u.name || '—') + '</div>' +
        '<div class="prof-meta">' + (u.city || '') + ctlStr + '</div>' +
      '</div>' +
      '<button class="follow-btn' + (u.is_following ? ' following' : '') + '" id="follow-' + u.id + '" onclick="toggleFollow(\'' + u.id + '\')">' +
        (u.is_following ? 'Siguiendo' : '+ Seguir') +
      '</button>' +
      '</div>';
  }

  window.toggleFollow = function (userId) {
    var btn = document.getElementById('follow-' + userId);
    var isFollowing = btn && btn.classList.contains('following');
    var method = isFollowing ? 'DELETE' : 'POST';
    fetch(API + '/community/follow/' + userId, { method: method, headers: hdrs })
      .then(function () {
        if (btn) {
          btn.classList.toggle('following', !isFollowing);
          btn.textContent = isFollowing ? '+ Seguir' : 'Siguiendo';
        }
        loadStats();
      }).catch(function () {});
  };

  // ═════════════════════════════════════════════════════════════════════════
  // CLUBS
  // ═════════════════════════════════════════════════════════════════════════

  function loadClubs() {
    fetch(API + '/community/groups', { headers: hdrs })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var groups = d.groups || d.results || [];
        var mine   = groups.filter(function (g) { return g.is_member; });
        var others = groups.filter(function (g) { return !g.is_member; });
        var myEl   = document.getElementById('clubs-grid');
        var dirEl  = document.getElementById('clubs-directory');
        if (myEl)  myEl.innerHTML  = mine.length  ? mine.map(clubCardHtml).join('')  : '<div style="color:var(--dim);font-size:.78rem">No perteneces a ningún club aún.</div>';
        if (dirEl) dirEl.innerHTML = others.length ? others.map(clubCardHtml).join('') : '<div style="color:var(--dim);font-size:.78rem">No hay más clubs disponibles.</div>';
      }).catch(function () {});
  }

  function clubCardHtml(g) {
    var sport_icons = { triathlon: '🏁', running: '🏃', cycling: '🚴', swimming: '🏊', all: '⚡' };
    var icon = sport_icons[g.sport_focus || g.sport] || '⚡';
    var color = g.avatar_color || g.color || '#0EA5E9';
    return '<div class="club-card" onclick="viewClub(\'' + g.id + '\')">' +
      '<div class="club-avatar" style="background:' + color + '22;color:' + color + ';border:1px solid ' + color + '44">' + icon + '</div>' +
      '<div class="club-name">' + (g.name || g.group_name || '—') + '</div>' +
      '<div class="club-meta">' + (g.member_count || 0) + ' miembros · ' + (g.sport_focus || g.sport || 'multi') + '</div>' +
      (g.is_member ? '<span class="club-badge">Miembro</span>' : '') +
      '</div>';
  }

  window.viewClub = function (id) {
    alert('Club ' + id + ' — Vista de detalle próximamente');
  };

  window.submitCreateClub = function () {
    var name    = document.getElementById('club-name').value.trim();
    var desc    = document.getElementById('club-desc').value.trim();
    var sport   = document.getElementById('club-sport').value;
    var privacy = document.getElementById('club-privacy').value;
    if (!name) { alert('El nombre es obligatorio'); return; }
    fetch(API + '/community/groups', {
      method: 'POST', headers: hdrs,
      body: JSON.stringify({ name: name, description: desc, sport_focus: sport, privacy: privacy })
    }).then(function () {
      closeModal('modal-club');
      loadClubs();
    }).catch(function () {});
  };

  // ═════════════════════════════════════════════════════════════════════════
  // CHALLENGES
  // ═════════════════════════════════════════════════════════════════════════

  function loadChallenges() {
    fetch(API + '/community/groups/all/challenges', { headers: hdrs })
      .catch(function () { return { ok: false }; })
      .then(function (r) {
        if (!r || !r.json) return [];
        return r.json();
      })
      .then(function (d) {
        var chs = d && (d.challenges || d.results || []);
        var el  = document.getElementById('challenges-grid');
        if (!el) return;
        if (!chs || !chs.length) {
          el.innerHTML = '<div class="empty-state"><div class="empty-icon">⚡</div><div class="empty-msg">No hay desafíos activos.<br>¡Crea el primero!</div></div>';
          return;
        }
        el.innerHTML = chs.map(challengeCardHtml).join('');
      }).catch(function () {
        var el = document.getElementById('challenges-grid');
        if (el) el.innerHTML = '<div class="empty-state"><div class="empty-icon">⚡</div><div class="empty-msg">Crea un desafío para empezar.</div></div>';
      });
  }

  function challengeCardHtml(c) {
    var pct  = c.my_pct !== undefined ? Math.min(c.my_pct, 100) : 0;
    var myVal = c.my_value !== undefined && c.my_value !== null ? c.my_value : null;
    var metric_suffix = { distance_km: ' km', tss: ' TSS', elevation_m: ' m', duration_h: 'h' };
    var suffix = metric_suffix[c.metric] || '';
    return '<div class="ch-card">' +
      '<div class="ch-title">' + (c.title || c.name || '—') + '</div>' +
      '<div class="ch-meta">' + (c.sport || 'todos') + ' · ' + (c.goal_value || 0) + suffix + ' · ' + (c.days_left !== undefined ? c.days_left + 'd restantes' : '') + '</div>' +
      (myVal !== null
        ? '<div class="ch-pct">' + Math.round(myVal) + suffix + ' / ' + (c.goal_value || 0) + suffix + ' (' + pct + '%)</div>' +
          '<div class="ch-prog-bar"><div class="ch-prog-fill" style="width:' + pct + '%"></div></div>'
        : '<button class="btn btn-primary btn-sm" style="margin-top:.4rem" onclick="joinChallenge(\'' + c.id + '\')">Unirse</button>') +
      '</div>';
  }

  window.joinChallenge = function (id) {
    fetch(API + '/community/groups/null/challenges/' + id + '/join', {
      method: 'POST', headers: hdrs, body: JSON.stringify({})
    }).then(function () { loadChallenges(); }).catch(function () {});
  };

  window.submitCreateChallenge = function () {
    var title  = document.getElementById('ch-title').value.trim();
    var sport  = document.getElementById('ch-sport').value;
    var metric = document.getElementById('ch-metric').value;
    var goal   = parseFloat(document.getElementById('ch-goal').value);
    var start  = document.getElementById('ch-start').value;
    var end    = document.getElementById('ch-end').value;
    if (!title || !goal || !start || !end) { alert('Completa todos los campos'); return; }
    if (start >= end) { alert('La fecha fin debe ser posterior al inicio'); return; }
    fetch(API + '/community/groups/global/challenges', {
      method: 'POST', headers: hdrs,
      body: JSON.stringify({ title: title, sport: sport, metric: metric, goal_value: goal, start_date: start, end_date: end })
    }).then(function () {
      closeModal('modal-challenge');
      loadChallenges();
    }).catch(function () {});
  };

  // ═════════════════════════════════════════════════════════════════════════
  // MY PUBLIC PROFILE
  // ═════════════════════════════════════════════════════════════════════════

  function loadMyProfile() {
    fetch(API + '/community/profile/me', { headers: hdrs })
      .catch(function () { return { ok: false }; })
      .then(function (r) { if (r && r.json) return r.json(); return null; })
      .then(function (d) {
        if (!d) { renderMyProfileFallback(); return; }
        var el = document.getElementById('my-profile-content');
        var u  = d.user || {};
        var ss = d.season_stats || {};
        var followers = d.follower_count || 0;
        var following = d.following_count || 0;
        el.innerHTML =
          '<div class="panel" style="margin-bottom:1.25rem">' +
          '<div style="padding:1.5rem;display:flex;align-items:flex-start;gap:1rem;flex-wrap:wrap">' +
          '<div class="prof-av" style="width:60px;height:60px;font-size:1.6rem">' + (u.avatar_initial || '?') + '</div>' +
          '<div style="flex:1">' +
          '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:1.4rem;font-weight:900">' + (u.name || '—') + '</div>' +
          '<div style="font-family:\'Oswald\',sans-serif;font-size:.65rem;color:var(--dim);letter-spacing:.08em;margin:.15rem 0 .75rem">' + (u.country_flag || '') + ' ' + (u.country_code || '') + '</div>' +
          '<div style="display:flex;gap:1.5rem">' +
          '<div><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:1.4rem;font-weight:900;color:var(--cyan)">' + followers + '</div><div style="font-family:\'Oswald\',sans-serif;font-size:.58rem;color:var(--dim)">SEGUIDORES</div></div>' +
          '<div><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:1.4rem;font-weight:900;color:var(--muted)">' + following + '</div><div style="font-family:\'Oswald\',sans-serif;font-size:.58rem;color:var(--dim)">SIGUIENDO</div></div>' +
          '</div></div></div></div>' +
          '<div class="g3" style="padding:0 1.25rem 1.25rem;gap:.75rem">' +
          [
            { label: 'Km temporada', value: ss.km + ' km',        color: 'var(--cyan)' },
            { label: 'TSS acumulado', value: Math.round(ss.tss),  color: 'var(--purple)' },
            { label: 'Horas totales', value: ss.hours + 'h',      color: 'var(--green)' },
          ].map(function (s) {
            return '<div class="stat-chip"><div class="stat-n" style="color:' + s.color + '">' + (s.value || '—') + '</div><div class="stat-l">' + s.label + '</div></div>';
          }).join('') +
          '</div></div>';
      }).catch(function () { renderMyProfileFallback(); });
  }

  function renderMyProfileFallback() {
    var el = document.getElementById('my-profile-content');
    if (el) el.innerHTML = '<div class="alert-chip info">Completa tu perfil en Configuración para mostrar tu página pública.</div>';
  }

  // ═════════════════════════════════════════════════════════════════════════
  // INIT
  // ═════════════════════════════════════════════════════════════════════════

  loadStats();
  loadRecentActivities();
  loadFeed(true);

  setTimeout(function () {
    document.getElementById('tabs-bar').classList.add('vis');
    if (typeof KL !== 'undefined' && KL.init) KL.init();
  }, 150);

}());
</script>
</body>
</html>
