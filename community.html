<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script src="routes.config.js?v=10"></script>
    <script>
      LX_ROUTES.guard();
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LabX — Comunidad</title>
    <script>
      try {
        var _k = JSON.parse(
          sessionStorage.getItem('kl_s') ||
            localStorage.getItem('kl_s') ||
            'null',
        );
        if (!_k) throw 0;
      } catch (e) {
        location.replace('login.html');
      }
    </script>
    <script>
      (function () {
        try {
          var s = JSON.parse(
            sessionStorage.getItem('kl_s') ||
              localStorage.getItem('kl_s') ||
              'null',
          );
          if (s && s.plan === 'basic')
            document.documentElement.classList.add('lx-free');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="theme-vars.css" />
    <script src="i18n.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        overflow-x: hidden;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .c {
        max-width: 980px;
        margin: 0 auto;
        padding: 0 clamp(1.25rem, 4vw, 2.5rem);
      }
      .ph {
        padding-top: 1.5rem;
        background: linear-gradient(180deg, #060e1c 0%, var(--bg) 100%);
        border-bottom: 1px solid var(--border2);
      }
      .ph-inner {
        padding: 1.5rem 0 1.2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
      }
      .ph-title {
        font-family: 'Oswald', sans-serif;
        font-size: 1.4rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        font-family: 'Oswald', sans-serif;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 0.38rem 0.9rem;
        border-radius: 6px;
        cursor: pointer;
        background: transparent;
        color: var(--muted);
        border: 1.5px solid var(--border);
      }
      .btn:hover {
        border-color: var(--cyan);
        color: var(--cyan);
      }
      #community-mount {
        padding: 1.5rem 0 5rem;
      }
    </style>
    <link rel="stylesheet" href="nav.css?v=3" />
  </head>
  <body>
    <aside id="sidebar"></aside>
    <header class="sb-topbar"></header>
    <div class="sb-overlay" id="sb-overlay"></div>

    <div class="ph">
      <div class="c">
        <div class="ph-inner">
          <h1 class="ph-title" data-i18n="nav_community">Comunidad</h1>
          <button
            class="btn"
            onclick="location.href = 'athlete_profile.html'"
            data-i18n="cmw_view_my_profile"
          >
            Ver mi perfil
          </button>
        </div>
      </div>
    </div>

    <div class="c">
      <div id="community-mount"></div>
    </div>

    <script src="auth.js"></script>
    <script src="lx-info.js"></script>
    <script src="nav.js?v=5" defer></script>
    <script src="footer.js"></script>
    <script src="dash-header.js"></script>
    <script src="lx-upgrade.js"></script>
    <script src="community.js?v=1"></script>
    <script>
      // Toda la logica de Comunidad (feed, ranking, clubes, escape de HTML,
      // modo lectura) vive en community.js; esta pagina solo lo monta.
      (function () {
        var s = {};
        try {
          s =
            JSON.parse(
              sessionStorage.getItem('kl_s') ||
                localStorage.getItem('kl_s') ||
                'null',
            ) || {};
        } catch (e) {}
        var rol = String(s.api_rol || '').toLowerCase();
        window.LXCommunity.mount(document.getElementById('community-mount'), {
          view: 'feed',
          canWrite: s.plan !== 'basic' && s.plan !== 'basico',
          userId: s.user_id,
          isCoach: rol === 'coach' || rol === 'admin',
          apiBase: '/api',
        });
      })();
    </script>
  </body>
</html>
