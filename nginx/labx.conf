# LabX — nginx Reverse Proxy Configuration
# Producción: Ubuntu 22.04 + Let's Encrypt (certbot)
#
# Setup:
#   sudo cp nginx/labx.conf /etc/nginx/sites-available/labx
#   sudo ln -s /etc/nginx/sites-available/labx /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d labx.app -d www.labx.app
#   sudo nginx -t && sudo systemctl reload nginx

# Rate limiting zones
limit_req_zone  $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone  $binary_remote_addr zone=api_limit:10m  rate=60r/m;
limit_req_zone  $binary_remote_addr zone=ai_limit:10m   rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Upstream (FastAPI / Gunicorn)
upstream labx_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name labx.app www.labx.app;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name labx.app www.labx.app;

    # SSL (certbot gestiona estos paths automáticamente)
    ssl_certificate     /etc/letsencrypt/live/labx.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labx.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # TLS hardening
    ssl_protocols      TLSv1.2 TLSv1.3;
    ssl_ciphers        HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache  shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling       on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none';" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/xml
               application/wasm image/svg+xml font/woff2;

    # Max upload (archivos .fit/.tcx)
    client_max_body_size 15m;

    # Connection limits
    limit_conn conn_limit 20;

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;

    # ── Static files (HTML/JS/CSS/PWA assets) ──────────────────────────────
    root /var/www/labx;

    # Service Worker — sin cache para siempre recibir versión nueva
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        expires 0;
    }

    # Manifest y íconos PWA
    location ~* \.(webmanifest|manifest\.json)$ {
        add_header Cache-Control "max-age=86400";
    }

    # Fuentes y assets estáticos — cache largo
    location ~* \.(woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # JS y CSS con hash — cache largo
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML — cache corto para recibir actualizaciones
    location ~* \.html$ {
        add_header Cache-Control "max-age=3600";
    }

    # ── API routes ──────────────────────────────────────────────────────────

    # Auth endpoints — rate limit estricto (5 req/min)
    location ~ ^/api(/v1)?/auth/(login|register|refresh) {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;
        add_header Retry-After 60 always;

        proxy_pass         http://labx_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # AI endpoints — rate limit moderado (10 req/min — LLM es caro)
    location ~ ^/api(/v1)?/ai/ {
        limit_req zone=ai_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://labx_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;  # AI puede tardar más
    }

    # Todos los otros endpoints de API
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://labx_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # No cachear respuestas de API
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Health check — sin rate limit, sin log (para uptime monitors)
    location = /health {
        proxy_pass         http://labx_api/health;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        access_log         off;
    }

    # OpenAPI docs — solo en dev (bloquear en producción si ENABLE_DOCS=0)
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass         http://labx_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        # Descomentar para bloquear en producción:
        # return 403;
    }

    # Fallback SPA — sirve index.html para rutas frontend
    location / {
        try_files $uri $uri.html $uri/ /dashboard.html;
    }

    # Bloquear acceso a archivos sensibles
    location ~* \.(env|env\.|gitignore|py|pyc|ini|cfg|toml|sql|db|sqlite)$ {
        return 404;
    }

    # Bloquear directorios internos
    location ~ ^/(api/|alembic/|\.git/) {
        return 404;
    }
}
